<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>우리반 - 카드 모음집</title>
    <link href="https://fonts.googleapis.com/css2?family=Dongle:wght@400;700&family=Jua&display=swap" rel="stylesheet">
    
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>

    <style>
        :root { 
            --wood-dark: #4e342e;
            --wood-bg: #6d4c41;
            --wood-shelf: #3e2723;
            --bg-cream: #f4ece1;
        }
        
        /* 📜 스크롤바 디자인 */
        ::-webkit-scrollbar { width: 14px; }
        ::-webkit-scrollbar-track { background: var(--bg-cream); border-radius: 10px; }
        ::-webkit-scrollbar-thumb { background: #a1887f; border-radius: 10px; border: 3px solid var(--bg-cream); }
        ::-webkit-scrollbar-thumb:hover { background: #795548; }

        body { 
            font-family: 'Jua', sans-serif; background-color: #a89d8f; 
            margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; 
            min-height: 100vh; overflow-x: hidden;
            opacity: 0; transition: opacity 0.5s ease-in; /* 투명하게 시작 */
        }
        body.fonts-loaded { opacity: 1; } /* 폰트 로딩 완료 시 나타남 */
        
        /* 🌟 창 크기를 5열(300px 카드 5장)에 맞춰 대폭 확대 */
        .app-container { background-color: var(--bg-cream); border-radius: 25px; border: 10px solid var(--wood-dark); box-shadow: 0 20px 40px rgba(0,0,0,0.4); width: 100%; max-width: 1750px; padding: 35px; position: relative; }
        
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; border-bottom: 4px solid var(--wood-dark); padding-bottom: 15px; }
        
        .title-wrap { display: flex; align-items: center; justify-content: center; flex-grow: 1; position: relative; }
        h1 { margin: 0; font-size: 2.8rem; color: var(--wood-dark); text-align: center; text-shadow: 2px 2px 0 rgba(0,0,0,0.1); }
        
        .hidden { display: none !important; }
        
        /* 공통 버튼 스타일 */
        .icon-btn, .action-btn, .btn-draw-all { 
            background-color: #8d6e63; color: white; border: none; padding: 10px 25px; font-size: 1.3rem; border-radius: 25px; cursor: pointer; font-family: 'Jua', sans-serif; transition: 0.2s; box-shadow: 0 4px 0 #5d4037; 
        }
        .icon-btn:active, .action-btn:active, .btn-draw-all:active { transform: translateY(4px); box-shadow: none; }
        
        /* 우측 상단 '전체' 버튼 */
        .btn-draw-all-top { position: absolute; right: 20px; }

        /* ⚙️ 설정 버튼 (톱니바퀴) */
        .setting-btn { 
            background: transparent; border: none; font-size: 2.5rem; cursor: pointer; transition: transform 0.2s; padding: 0; margin-left: 15px;
        }
        .setting-btn:hover { transform: rotate(45deg) scale(1.1); }

        /* 📚 가로 5열 우드 진열대 스타일 */
        .grid-container { 
            display: grid; 
            grid-template-columns: repeat(5, 1fr); 
            gap: 0 25px; 
            background-color: var(--wood-bg);
            background-image: repeating-linear-gradient(to bottom, transparent, transparent 180px, var(--wood-shelf) 180px, var(--wood-shelf) 200px);
            border-radius: 15px; border: 8px solid var(--wood-dark);
            box-shadow: inset 0 10px 20px rgba(0,0,0,0.5);
            grid-auto-rows: 200px; 
            align-items: end; padding: 0 40px; min-height: 400px;
        }
        
        /* 📖 로비: 베이지톤 책 모양 (Dongle체 적용) */
        .card-category { 
            height: 130px; width: 100%; max-width: 220px; 
            margin: 0 auto 20px auto; 
            background: linear-gradient(135deg, #fff3e0, #f5e6d3); 
            border-left: 18px solid #8d6e63; 
            border-radius: 6px 15px 15px 6px; color: #4e342e; 
            font-size: 2.6rem; 
            cursor: pointer; 
            display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
            box-shadow: inset -5px 0 10px rgba(0,0,0,0.05), 5px 5px 8px rgba(0,0,0,0.4); 
            transition: all 0.2s cubic-bezier(0.25, 0.8, 0.25, 1); padding: 8px 15px; position: relative;
            font-family: 'Dongle', sans-serif; font-weight: 700; line-height: 1.0; word-break: keep-all;
            transform-origin: bottom center; will-change: transform; z-index: 2;
        }
        
        /* 📌 길어진 갈색 인덱스 */
        .card-category::before {
            content: ''; position: absolute; top: -10px; right: 25px; 
            width: 22px; height: 38px;
            background-color: #5d4037; border-radius: 4px 4px 2px 2px;
            box-shadow: inset -2px 0 4px rgba(0,0,0,0.2), 2px 2px 5px rgba(0,0,0,0.3);
            z-index: -1; 
        }
        
        .card-category::after {
            content: ''; position: absolute; right: 0; top: 6px; bottom: 6px; width: 6px;
            background: rgba(255,255,255,0.9); border-radius: 0 10px 10px 0;
        }
        .card-category:hover { 
            transform: scale(1.05) translateY(-6px) rotate(-1deg); 
            box-shadow: inset -5px 0 10px rgba(0,0,0,0.05), 10px 15px 20px rgba(0,0,0,0.6); 
            z-index: 5;
        }

        /* 뽑기 화면 컨트롤 */
        .controls-wrapper { display: flex; justify-content: center; margin-bottom: 25px; }
        .controls { background: var(--wood-dark); padding: 15px 30px; border-radius: 40px; display: inline-flex; align-items: center; gap: 15px; z-index: 100; position: relative; color: white;}
        .controls input { font-size: 1.6rem; width: 80px; text-align: center; border: 3px solid #8d6e63; border-radius: 15px; padding: 8px; font-family: 'Jua', sans-serif; color: var(--wood-dark); }
        .controls label { font-size: 1.3rem; }

        /* 🃏 결과 영역 (5열 배치 최적화) */
        .result-grid { 
            display: flex; flex-wrap: wrap; justify-content: center; align-items: center; 
            gap: 30px; perspective: 1500px; padding-top: 10px; min-height: 550px; max-width: 1700px; margin: 0 auto;
        }
        
        @keyframes flipAppear {
            0% { opacity: 0; transform: rotateY(-180deg) scale(0.5); }
            100% { opacity: 1; transform: rotateY(0deg) scale(1); }
        }
        
        /* 🌟 세로형 카드 1.5배 확대 */
        .flip-container { 
            width: 300px; height: 420px; cursor: default; opacity: 0; 
            animation: flipAppear 0.5s ease-out forwards; 
            will-change: transform, opacity; transform: translateZ(0); 
        }
        .flip-container.horizontal { width: 420px; height: 300px; }

        /* 전부 펼치기 모드 (축소) */
        .result-grid.draw-all-mode .flip-container { width: 160px; height: 224px; }
        .result-grid.draw-all-mode .flip-container.horizontal { width: 224px; height: 160px; }
        
        .flipper { width: 100%; height: 100%; position: relative; transition: transform 0.5s ease; transform-style: preserve-3d; will-change: transform; }
        .flip-container:hover .flipper { transform: scale(1.05); } 
        
        .can-flip { cursor: pointer !important; }
        .flip-container.is-flipped .flipper { transform: rotateY(180deg); }
        .flip-container.is-flipped:hover .flipper { transform: rotateY(180deg) scale(1.05); }

        .card-front, .card-back { 
            width: 100%; height: 100%; position: absolute; top: 0; left: 0; 
            backface-visibility: hidden; border-radius: 20px; box-shadow: 0 10px 20px rgba(0,0,0,0.2); 
            object-fit: contain; background-color: white; padding: 10px; box-sizing: border-box; 
        }
        .card-back { transform: rotateY(180deg); }

        /* 🃏 귀여운 마시멜로 '?' 카드 디자인 */
        .placeholder-card { animation: none; opacity: 1; }
        .placeholder-card .card-front {
            background: #FFF8E1; /* 따뜻한 베이지색 배경 */
            border: 10px solid #4E342E; /* 진한 갈색 테두리 */
            display: flex; flex-direction: column; justify-content: center; align-items: center; 
            border-radius: 20px; position: relative;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.05), 8px 10px 20px rgba(0,0,0,0.3); 
        }
        
        /* 안쪽 점선 테두리로 카드 느낌 뿜뿜 */
        .placeholder-card .card-front::before {
            content: ''; position: absolute; top: 8px; left: 8px; right: 8px; bottom: 8px;
            border: 3px dashed rgba(78, 52, 46, 0.3); border-radius: 10px; pointer-events: none;
        }
        
        /* 마시멜로처럼 통통한 폰트의 물음표 */
        .placeholder-card .card-front .q-mark { 
            font-size: 15rem; 
            color: #4E342E; 
            font-family: 'Dongle', sans-serif;
            text-shadow: 4px 4px 0px rgba(0,0,0,0.1); 
            z-index: 1;
            margin: 0;
            line-height: 0.5; /* 상하 여백 조절 */
        }

        /* 👩‍🏫 교사용 설정 (우드톤) */
        #teacherView { background-color: #5d4037; color: #fffaf0; padding: 30px; border-radius: 30px; text-align: left; }
        .add-card-box { display: flex; gap: 10px; margin-bottom: 25px; flex-wrap: wrap; align-items: center; }
        .add-card-box input, .add-card-box select { padding: 12px; border-radius: 12px; border: none; font-family: 'Jua', sans-serif; font-size: 1.1rem; color: #4e342e; }
        .add-card-box input[type="text"] { flex: 2; min-width: 120px; }
        .add-card-box input[type="number"] { flex: 1; min-width: 80px; }
        .add-card-box select { flex: 1; min-width: 100px; cursor: pointer; }

        .table-container { border-radius: 15px; overflow: hidden; background: #4e342e; }
        .teacher-table { width: 100%; border-collapse: collapse; color: white; font-family: 'Malgun Gothic', sans-serif;}
        .teacher-table th { background-color: #3e2723; padding: 15px; text-align: center; }
        .teacher-table td { padding: 12px; border-bottom: 1px solid #6d4c41; text-align: center; font-size: 1rem; }
        .drag-handle { cursor: grab; font-size: 1.2rem; color: #bcaaa4; padding: 0 10px; }
        .delete-btn { background-color: #ef5350; border: none; color: white; padding: 7px 15px; border-radius: 10px; cursor: pointer; font-family: 'Jua', sans-serif; }

        /* 🪞 거울카드 일괄 등록 모달 */
        #mirrorModal { display:none; position:fixed; inset:0; background:rgba(0,0,0,.7); z-index:9999; overflow-y:auto; padding:24px; }
        .mirror-box { background:#3e2723; border-radius:24px; max-width:900px; margin:0 auto; padding:28px; color:#fffaf0; }
        .mirror-box h3 { margin:0 0 16px; font-size:1.6rem; }
        .mirror-img-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(130px,1fr)); gap:12px; margin:16px 0; }
        .mirror-img-item { position:relative; border-radius:14px; overflow:hidden; border:3px solid #6d4c41; cursor:pointer; transition:.2s; }
        .mirror-img-item img { width:100%; aspect-ratio:3/4; object-fit:cover; display:block; }
        .mirror-img-item.is-front { border-color:#66bb6a; }
        .mirror-img-item.is-back  { border-color:#42a5f5; }
        .mirror-role-badge { position:absolute; bottom:0; left:0; right:0; text-align:center; font-size:.85rem; font-weight:700; padding:4px 0; }
        .mirror-img-item.is-front .mirror-role-badge { background:rgba(102,187,106,.9); color:#fff; }
        .mirror-img-item.is-back  .mirror-role-badge { background:rgba(66,165,245,.9);  color:#fff; }
        .mirror-img-item.is-none  .mirror-role-badge { background:rgba(0,0,0,.5); color:#ddd; }
        .mirror-pair-preview { display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:12px; margin-top:12px; }
        .mirror-pair-card { background:#5d4037; border-radius:14px; padding:10px; display:flex; gap:8px; align-items:center; }
        .mirror-pair-card img { width:72px; height:96px; object-fit:cover; border-radius:8px; }
        .mirror-pair-arrow { font-size:1.4rem; color:#bcaaa4; }
        .mirror-modal-btns { display:flex; gap:12px; margin-top:20px; flex-wrap:wrap; }
        .mirror-btn-primary { background:#8d6e63; color:#fff; border:none; padding:12px 28px; border-radius:20px; font-size:1.1rem; font-family:'Jua',sans-serif; cursor:pointer; box-shadow:0 4px 0 #5d4037; }
        .mirror-btn-primary:active { transform:translateY(4px); box-shadow:none; }
        .mirror-btn-cancel  { background:#4e342e; color:#bcaaa4; border:none; padding:12px 22px; border-radius:20px; font-size:1.1rem; font-family:'Jua',sans-serif; cursor:pointer; }
    </style>
</head>
<body>
    <div class="app-container">
        <header>
            <button id="backBtn" class="icon-btn hidden">◀ 서재로</button>
            <div class="title-wrap">
                <h1 id="mainTitle">카드 모음집</h1>
                <button id="drawAllBtn" class="btn-draw-all-top btn-draw-all hidden">전체</button>
            </div>
            <div id="teacherHeaderBtns" style="display:none; gap:10px; align-items:center;">
                <button id="mirrorBatchBtn" class="action-btn" style="font-size:.95rem; padding:10px 18px; background:#7b5ea7; white-space:nowrap;">🪞 일괄 등록</button>
                <button id="exportBtn"      class="action-btn" style="font-size:.95rem; padding:10px 18px; background:#5d8a5e; white-space:nowrap;">📤 내보내기</button>
                <button id="importBtn"      class="action-btn" style="font-size:.95rem; padding:10px 18px; background:#5d7a8a; white-space:nowrap;">📥 불러오기</button>
                <input type="file" id="importFile" accept=".json" style="display:none;">
            </div>
            <button id="goTeacherBtn" class="setting-btn" title="카드 설정">⚙️</button>
        </header>

        <main>
            <section id="studentLobby">
                <div style="display:flex; align-items:center; gap:0;">
                    <button id="lobbyPrevBtn" onclick="lobbyChangePage(-1)" style="display:none; background:none; border:none; font-size:3rem; color:#d7ccc8; cursor:pointer; padding:0 10px; line-height:1; transition:.2s; flex-shrink:0;" onmouseover="this.style.color='#fff'" onmouseout="this.style.color='#d7ccc8'">‹</button>
                    <div id="cardGrid" class="grid-container" style="flex:1;"></div>
                    <button id="lobbyNextBtn" onclick="lobbyChangePage(1)"  style="display:none; background:none; border:none; font-size:3rem; color:#d7ccc8; cursor:pointer; padding:0 10px; line-height:1; transition:.2s; flex-shrink:0;" onmouseover="this.style.color='#fff'" onmouseout="this.style.color='#d7ccc8'">›</button>
                </div>
                <div id="lobbyPageInfo" style="text-align:center; color:#a1887f; font-size:1rem; margin-top:8px; display:none;"></div>
            </section>

            <section id="drawView" class="hidden">
                <div class="controls-wrapper">
                    <div class="controls">
                        <label>찾을 장수:</label>
                        <input type="number" id="drawCount" value="1" min="1">
                        <button id="drawBtn" class="action-btn">뽑기</button>
                    </div>
                </div>
                <div id="resultArea" class="result-grid"></div>
            </section>

            <section id="teacherView" class="hidden">
                <div>
                    <h2 style="font-family:'Jua'; margin-top:0;">카드 설정</h2>
                    <div class="add-card-box">
                            <input type="text" id="newCardName" placeholder="표시 이름 (예: 도란도란)">
                            <input type="text" id="newCardFolder" placeholder="폴더명">
                            <select id="newCardOrientation">
                                <option value="vertical">세로형 ↕</option>
                                <option value="horizontal">가로형 ↔</option>
                            </select>
                            <input type="number" id="newCardTotal" placeholder="장수">
                            <button id="addCardBtn" class="action-btn" style="font-size:1rem; padding:10px 20px;">저장</button>
                            <button id="cancelEditBtn" class="icon-btn hidden" style="background:#666;">취소</button>
                        </div>
                    <div class="table-container">
                        <table class="teacher-table">
                            <thead>
                                <tr><th style="width:40px;">순서</th><th>표시 이름</th><th>폴더명</th><th>형태</th><th>장수</th><th style="width:60px;">보이기</th><th style="width:60px;">관리</th></tr>
                            </thead>
                            <tbody id="cardManageList"></tbody>
                        </table>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <!-- 🪞 거울카드 일괄 등록 모달 -->
    <div id="mirrorModal">
        <div class="mirror-box">
            <h3>🪞 거울카드 일괄 등록</h3>
            <div style="display:flex; gap:12px; flex-wrap:wrap; align-items:center; margin-bottom:12px;">
                <input type="text" id="mirrorCardName" placeholder="카드 이름 (예: 거울카드)" style="padding:10px 14px; border-radius:12px; border:none; font-family:'Jua',sans-serif; font-size:1.1rem; color:#4e342e; flex:1; min-width:140px;">
                <input type="text" id="mirrorCardFolder" placeholder="GitHub 폴더명 (예: 거울카드)" style="padding:10px 14px; border-radius:12px; border:none; font-family:'Jua',sans-serif; font-size:1.1rem; color:#4e342e; flex:1; min-width:140px;">
                <select id="mirrorCardOrientation" style="padding:10px 14px; border-radius:12px; border:none; font-family:'Jua',sans-serif; font-size:1.1rem; color:#4e342e;">
                    <option value="vertical">세로형 ↕</option>
                    <option value="horizontal">가로형 ↔</option>
                </select>
            </div>
            <p style="font-size:.85rem; color:#bcaaa4; margin:0 0 10px;">💡 이미지를 GitHub 폴더에 업로드한 뒤, 폴더명을 입력하고 같은 파일들을 선택하세요.</p>
            <label style="display:inline-block; background:#8d6e63; color:#fff; padding:10px 22px; border-radius:20px; cursor:pointer; font-size:1rem; font-family:'Jua',sans-serif; box-shadow:0 4px 0 #5d4037;">
                📁 이미지 선택 (여러 장)
                <input type="file" id="mirrorFileInput" accept="image/*" multiple style="display:none;" onchange="handleMirrorFiles(this.files)">
            </label>
            <p style="font-size:.9rem; color:#bcaaa4; margin:10px 0 4px;">이미지를 클릭해서 <span style="color:#a5d6a7;">앞면</span> / <span style="color:#90caf9;">뒷면</span>을 지정하세요.</p>
            <div id="mirrorImgGrid" class="mirror-img-grid"></div>
            <div id="mirrorPairSection" style="display:none;">
                <p style="font-weight:700; margin:16px 0 8px; font-size:1rem;">📌 짝 미리보기 <span id="mirrorPairCount" style="color:#bcaaa4; font-size:.9rem;"></span></p>
                <div id="mirrorPairPreview" class="mirror-pair-preview"></div>
            </div>
            <div class="mirror-modal-btns">
                <button class="mirror-btn-primary" onclick="saveMirrorCard()">✅ 등록하기</button>
                <button class="mirror-btn-cancel" onclick="closeMirrorModal()">취소</button>
            </div>
            <p id="mirrorStatus" style="margin-top:12px; font-size:.9rem; color:#a5d6a7;"></p>
        </div>
    </div>

    <script>
// 폰트가 모두 다운로드되면 화면을 부드럽게 띄움
        document.fonts.ready.then(() => document.body.classList.add('fonts-loaded'));
        // --- 1. Cloudflare KV API ---
        const API = 'https://card.csgo0404.workers.dev/api/cards';
        let adminPw = '';

        async function fetchCards() {
            const r = await fetch(API);
            return r.ok ? r.json() : [];
        }
        async function saveCards(arr) {
            const r = await fetch(API, {
                method: 'PUT',
                headers: { 'content-type': 'application/json', 'x-auth': adminPw },
                body: JSON.stringify(arr)
            });
            if (!r.ok) { alert('저장 실패: ' + r.status); throw new Error('save failed'); }
            // 저장 성공 시 로컬 캐시 갱신 + 화면도 즉시 다시 그림
            cardSettings = arr;
            localStorage.setItem('cookieClassCachedCards', JSON.stringify(arr));
            renderLobby();
            renderTable();
        }
        function newId() {
            return (crypto.randomUUID ? crypto.randomUUID() : 'c' + Date.now() + Math.random().toString(36).slice(2,8));
        }

        // 🎵 2. 효과음 (웹 오디오 API)
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx;

        function initAudio() {
            if (!audioCtx) audioCtx = new AudioContext();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function playSimultaneousDrawSound() {
            initAudio();
            const now = audioCtx.currentTime;
            const freqs = [523.25, 659.25, 783.99, 1046.50, 1318.51, 1567.98]; 
            freqs.forEach((freq, index) => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, now + (index * 0.05));
                gain.gain.setValueAtTime(0, now + (index * 0.05));
                gain.gain.linearRampToValueAtTime(0.15, now + (index * 0.05) + 0.02);
                gain.gain.exponentialRampToValueAtTime(0.01, now + (index * 0.05) + 0.8);
                osc.start(now + (index * 0.05));
                osc.stop(now + (index * 0.05) + 0.8);
            });
        }

        function playFlipSound() {
            initAudio();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.type = 'triangle'; 
            osc.frequency.setValueAtTime(1200, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(2200, audioCtx.currentTime + 0.1); 
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            osc.start(); osc.stop(audioCtx.currentTime + 0.3);
        }

        let cardSettings = [];   // KV 카드 (서버)

        // ===== IndexedDB (거울카드 로컬 저장) =====
        let _idb = null;
        function openIDB() {
            if (_idb) return Promise.resolve(_idb);
            return new Promise((res, rej) => {
                const req = indexedDB.open('mirrorCards', 1);
                req.onupgradeneeded = e => e.target.result.createObjectStore('cards', { keyPath: 'id' });
                req.onsuccess = e => { _idb = e.target.result; res(_idb); };
                req.onerror   = e => rej(e.target.error);
            });
        }
        async function idbGetAll() {
            const db = await openIDB();
            return new Promise((res, rej) => {
                const tx = db.transaction('cards', 'readonly');
                const req = tx.objectStore('cards').getAll();
                req.onsuccess = e => res(e.target.result || []);
                req.onerror   = e => rej(e.target.error);
            });
        }
        async function idbPut(card) {
            const db = await openIDB();
            return new Promise((res, rej) => {
                const tx = db.transaction('cards', 'readwrite');
                tx.objectStore('cards').put(card);
                tx.oncomplete = res; tx.onerror = e => rej(e.target.error);
            });
        }
        async function idbDelete(id) {
            const db = await openIDB();
            return new Promise((res, rej) => {
                const tx = db.transaction('cards', 'readwrite');
                tx.objectStore('cards').delete(id);
                tx.oncomplete = res; tx.onerror = e => rej(e.target.error);
            });
        }

            const visible = cardSettings.filter(c => !c.hidden);

        // 폴더별 파일명 패턴(공백 유무) 캐시
        function getPatternKey(folder) { return 'cardPattern_' + folder; }
        function getCachedPattern(folder) { return localStorage.getItem(getPatternKey(folder)); }
        function setCachedPattern(folder, p) { localStorage.setItem(getPatternKey(folder), p); }

        // 패턴 감지: 첫 이미지가 어느 URL로 로드되는지 확인 (1회 요청)
        function detectPattern(card) {
            const cached = getCachedPattern(card.folder);
            if (cached) return Promise.resolve(cached);
            const folderEncoded = encodeURIComponent(card.folder);
            return new Promise(resolve => {
                const img = new Image();
                img.onload = () => { setCachedPattern(card.folder, 'spaced'); resolve('spaced'); };
                img.onerror = () => { setCachedPattern(card.folder, 'plain'); resolve('plain'); };
                img.src = `./${folderEncoded}/%20(1).webp`;
            });
        }

        function buildFrontUrl(folder, n, pattern) {
            const f = encodeURIComponent(folder);
            return pattern === 'spaced' ? `./${f}/%20(${n}).webp` : `./${f}/(${n}).webp`;
        }
        function buildBackUrl(folder, n, pattern) {
            const f = encodeURIComponent(folder);
            return pattern === 'spaced' ? `./${f}/뒷면%20(${n}).webp` : `./${f}/뒷면(${n}).webp`;
        }

        // 브라우저 렉 방지용 강력한 이미지 미리 불러오기 함수
        async function preloadImages(card) {
            const pattern = await detectPattern(card);

            let hiddenDiv = document.getElementById('hidden-preload-area');
            if(!hiddenDiv) {
                hiddenDiv = document.createElement('div');
                hiddenDiv.id = 'hidden-preload-area';
                hiddenDiv.style.display = 'none';
                document.body.appendChild(hiddenDiv);
            }
            hiddenDiv.innerHTML = '';

            for(let i = 1; i <= card.totalImages; i++) {
                const img = new Image();
                img.src = buildFrontUrl(card.folder, i, pattern);
                img.decoding = 'async';
                img.fetchPriority = 'high';
                hiddenDiv.appendChild(img);
            }
        }

        function handleMirrorFiles(files) {
            // blob URL 방식 — base64 변환 없음
            _mirrorImages.forEach(m => { if (m.blobUrl) URL.revokeObjectURL(m.blobUrl); });
            _mirrorImages = [...files].map(file => ({
                file,
                name: file.name,
                blobUrl: URL.createObjectURL(file),

        function renderMirrorGrid() {
            const grid = document.getElementById('mirrorImgGrid');
            grid.innerHTML = _mirrorImages.map((m, i) => {
                const roleClass = m.role === 'front' ? 'is-front' : m.role === 'back' ? 'is-back' : 'is-none';
                const roleNum  = m.role === 'front'
                    ? '앞면 ' + (_mirrorImages.slice(0,i+1).filter(x=>x.role==='front').length)
                    : m.role === 'back'
                    ? '뒷면 ' + (_mirrorImages.slice(0,i+1).filter(x=>x.role==='back').length)
                    : '미지정';
                return `<div class="mirror-img-item ${roleClass}" onclick="cycleMirrorRole(${i})">
                    <img src="${m.blobUrl}" alt="${m.name}">

            }).join('');

        }

        function cycleMirrorRole(idx) {
            const order = ['none', 'front', 'back'];
            const cur = _mirrorImages[idx].role;
            _mirrorImages[idx].role = order[(order.indexOf(cur) + 1) % order.length];
            renderMirrorGrid();
        }

        function updateMirrorPairPreview() {
            const fronts = _mirrorImages.filter(m => m.role === 'front');
            const backs  = _mirrorImages.filter(m => m.role === 'back');

            if (!count) { sec.style.display = 'none'; return; }

        async function resizeToDataUrl(dataUrl, maxPx = 900, quality = 0.82) {
            return new Promise(res => {
                const img = new Image();
                img.onload = () => {
                    let { width: w, height: h } = img;
                    if (w > maxPx || h > maxPx) {
                        const ratio = Math.min(maxPx / w, maxPx / h);
                        w = Math.round(w * ratio); h = Math.round(h * ratio);
                    }
                    const cv = document.createElement('canvas');
                    cv.width = w; cv.height = h;
                    cv.getContext('2d').drawImage(img, 0, 0, w, h);
                    res(cv.toDataURL('image/jpeg', quality));
                };
                img.src = dataUrl;
            });
        }

        async function saveMirrorCard() {
            const name   = document.getElementById('mirrorCardName').value.trim();
            const folder = document.getElementById('mirrorCardFolder').value.trim();
            if (!name)   { alert('카드 이름을 입력해 주세요.'); return; }
            if (!folder) { alert('GitHub 폴더명을 입력해 주세요.'); return; }
            const fronts = _mirrorImages.filter(m => m.role === 'front');
            const backs  = _mirrorImages.filter(m => m.role === 'back');
            const count  = Math.min(fronts.length, backs.length);
            if (!count) { alert('앞면과 뒷면이 각각 1장 이상 필요해요.'); return; }
            const orientation = document.getElementById('mirrorCardOrientation').value;
            const status = document.getElementById('mirrorStatus');
            // 파일명만 저장 — base64 변환 없음
            const customPairs = Array.from({length: count}, (_, i) => ({
                front: fronts[i].name,
                back:  backs[i].name
            }));
            status.textContent = '서버에 저장 중...';
            let updated;
            if (_editingMirrorId) {
                updated = cardSettings.map(c => c.id === _editingMirrorId
                    ? { ...c, name, folder, orientation, totalImages: count, customPairs }
                    : c);
            } else {
                const newCard = { id: newId(), order: cardSettings.length, name, folder, orientation, totalImages: count, customPairs };
                updated = [...cardSettings, newCard];
            }
            try {
                await saveCards(updated);
                status.textContent = `✅ "${name}" ${_editingMirrorId ? '수정' : '등록'} 완료! (${count}쌍)`;
                setTimeout(closeMirrorModal, 1200);
            } catch (e) {
                status.textContent = '❌ 저장 실패: ' + e.message;
            }
        }

        // --- '전체' 버튼 ---
        document.getElementById('drawAllBtn').onclick = () => {

            // 🔥 전체 버튼을 눌렀다는 플래그를 저장합니다 (애니메이션 딜레이 조절용)

        // --- 5. 🃏 렉 없는 동시 애니메이션 (시간차 부여 & Async 적용) ---
        document.getElementById('drawBtn').onclick = async () => {
            let count = parseInt(drawCountInput.value);
            const total = currentCard.totalImages;
            const isHorizontal = currentCard.orientation === 'horizontal';
            const wasDrawAll = isDrawAllClicked;

            if(isDrawAllClicked || count > 10) resultArea.classList.add('draw-all-mode');
            else resultArea.classList.remove('draw-all-mode');
            isDrawAllClicked = false;

            initAudio();
            playSimultaneousDrawSound();

            let nums = Array.from({length: total}, (_, i) => i + 1);
            for (let i = nums.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [nums[i], nums[j]] = [nums[j], nums[i]];
            }
            if(count > total) count = total;
            nums = nums.slice(0, count);

            resultArea.innerHTML = '';
            const fragment = document.createDocumentFragment();
            const delayTime = wasDrawAll ? 0.04 : 0.02;

            if (currentCard.customPairs) {
                // 🪞 거울카드: 파일명 → GitHub URL
                const folderEnc = encodeURIComponent(currentCard.folder || '');
                nums.forEach((n, index) => {
                    const pair = currentCard.customPairs[n - 1];
                    if (!pair) return;
                    // pair.front/back 이 base64(data:)이면 그대로, 파일명이면 폴더 URL 조합
                    const frontSrc = pair.front.startsWith('data:') ? pair.front : `./${folderEnc}/${encodeURIComponent(pair.front)}`;
                    const backSrc  = pair.back.startsWith('data:')  ? pair.back  : `./${folderEnc}/${encodeURIComponent(pair.back)}`;
                    const container = document.createElement('div');
                    container.className = 'flip-container can-flip' + (isHorizontal ? ' horizontal' : '');
                    container.style.animationDelay = `${index * delayTime}s`;
                    container.innerHTML = `
                        <div class="flipper">
                            <img src="${frontSrc}" class="card-front" decoding="async">
                            <img src="${backSrc}"  class="card-back"  decoding="async">
                        </div>`;
                    container.onclick = () => { playFlipSound(); container.classList.toggle('is-flipped'); };
                    fragment.appendChild(container);
                });
            } else {
                // 📁 기존 폴더 기반 카드
                const pattern = await detectPattern(currentCard);
                nums.forEach((n, index) => {
                    const container = document.createElement('div');
                    container.className = 'flip-container' + (isHorizontal ? ' horizontal' : '');
                    container.style.animationDelay = `${index * delayTime}s`;

                    const frontUrl = buildFrontUrl(currentCard.folder, n, pattern);
                    const folderEnc = encodeURIComponent(currentCard.folder);
                    const backSpaced = `./${folderEnc}/뒷면%20(${n}).webp`;
                    const backNormal = `./${folderEnc}/뒷면(${n}).webp`;
                    const backPrimary  = pattern === 'spaced' ? backSpaced : backNormal;
                    const backFallback = pattern === 'spaced' ? backNormal : backSpaced;

                    container.innerHTML = `
                        <div class="flipper">
                            <img src="${frontUrl}" class="card-front" decoding="async" fetchpriority="high">
                            <img src="${backPrimary}" class="card-back" id="backImg_${n}" decoding="async"
                                 onerror="this.onerror=null; this.src='${backFallback}';">
                        </div>`;

                    const enableFlip = () => {
                        container.classList.add('can-flip');
                        container.onclick = () => { playFlipSound(); container.classList.toggle('is-flipped'); };
                    };
                    const checkPrimary = new Image();
                    checkPrimary.onload = enableFlip;
                    checkPrimary.onerror = () => {
                        const checkFallback = new Image();
                        checkFallback.onload = enableFlip;
                        checkFallback.onerror = () => {
                            const el = document.getElementById(`backImg_${n}`);
                            if(el) el.style.display = 'none';
                        };
                        checkFallback.src = backFallback;
                    };
                    checkPrimary.src = backPrimary;
                    fragment.appendChild(container);
                });
            }

            resultArea.appendChild(fragment);
        };
    </script>
</body>
</html>
