<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>우리반 - 생각 책방</title>
    <link href="https://fonts.googleapis.com/css2?family=Dongle:wght@400;700&family=Jua&display=swap" rel="stylesheet">
    
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>

    <style>
        :root { 
            --wood-dark: #4e342e;
            --wood-bg: #6d4c41;
            --wood-shelf: #3e2723;
            --bg-cream: #f4ece1;
        }
        
        /* 📜 스크롤바 디자인 */
        ::-webkit-scrollbar { width: 14px; }
        ::-webkit-scrollbar-track { background: var(--bg-cream); border-radius: 10px; }
        ::-webkit-scrollbar-thumb { background: #a1887f; border-radius: 10px; border: 3px solid var(--bg-cream); }
        ::-webkit-scrollbar-thumb:hover { background: #795548; }

        body { 
            font-family: 'Jua', sans-serif; background-color: #a89d8f; 
            margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; 
            min-height: 100vh; overflow-x: hidden;
            opacity: 0; transition: opacity 0.5s ease-in; /* 투명하게 시작 */
        }
        body.fonts-loaded { opacity: 1; } /* 폰트 로딩 완료 시 나타남 */
        
        /* 🌟 창 크기를 5열(300px 카드 5장)에 맞춰 대폭 확대 */
        .app-container { background-color: var(--bg-cream); border-radius: 25px; border: 10px solid var(--wood-dark); box-shadow: 0 20px 40px rgba(0,0,0,0.4); width: 100%; max-width: 1750px; padding: 35px; position: relative; }
        
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; border-bottom: 4px solid var(--wood-dark); padding-bottom: 15px; }
        
        .title-wrap { display: flex; align-items: center; justify-content: center; flex-grow: 1; position: relative; }
        h1 { margin: 0; font-size: 4.2rem; color: var(--wood-dark); text-align: center; text-shadow: 2px 2px 0 rgba(0,0,0,0.1); }
        
        .hidden { display: none !important; }
        
        /* 공통 버튼 스타일 */
        .icon-btn, .action-btn, .btn-draw-all { 
            background-color: #8d6e63; color: white; border: none; padding: 10px 25px; font-size: 1.3rem; border-radius: 25px; cursor: pointer; font-family: 'Jua', sans-serif; transition: 0.2s; box-shadow: 0 4px 0 #5d4037; 
        }
        .icon-btn:active, .action-btn:active, .btn-draw-all:active { transform: translateY(4px); box-shadow: none; }
        
        /* 우측 상단 '전체' 버튼 */
        .btn-draw-all-top { position: absolute; right: 20px; }

        /* ⚙️ 설정 버튼 (톱니바퀴) */
        .setting-btn { 
            background: transparent; border: none; font-size: 2.5rem; cursor: pointer; transition: transform 0.2s; padding: 0; margin-left: 15px;
        }
        .setting-btn:hover { transform: rotate(45deg) scale(1.1); }

        /* 📚 가로 5열 우드 진열대 스타일 */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 0 25px;
            background-color: var(--wood-bg);
            background-image: repeating-linear-gradient(to bottom, transparent, transparent 310px, var(--wood-shelf) 310px, var(--wood-shelf) 335px);
            border-radius: 15px; border: 8px solid var(--wood-dark);
            box-shadow: inset 0 10px 20px rgba(0,0,0,0.5);
            grid-auto-rows: 335px;
            align-items: end; padding: 0 40px; min-height: 670px;
        }

        /* 📖 로비: 베이지톤 책 모양 */
        .card-category {
            height: 235px; width: 100%; max-width: 160px;
            margin: 0 auto 32px auto;
            background: linear-gradient(135deg, #fff3e0, #f5e6d3);
            border-left: 18px solid #8d6e63;
            border-radius: 6px 15px 15px 6px; color: #4e342e;
            font-size: 3.9rem;
            cursor: pointer;
            display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
            box-shadow: inset -5px 0 10px rgba(0,0,0,0.05), 5px 5px 8px rgba(0,0,0,0.4);
            transition: all 0.2s cubic-bezier(0.25, 0.8, 0.25, 1); padding: 8px 15px; position: relative;
            font-family: 'Dongle', sans-serif; font-weight: 700; line-height: 1.0; word-break: keep-all;
            transform-origin: bottom center; will-change: transform; z-index: 2;
        }
        .card-category::before {
            content: ''; position: absolute; top: -10px; right: 25px;
            width: 22px; height: 38px;
            background-color: #5d4037; border-radius: 4px 4px 2px 2px;
            box-shadow: inset -2px 0 4px rgba(0,0,0,0.2), 2px 2px 5px rgba(0,0,0,0.3);
            z-index: -1;
        }
        .card-category::after {
            content: ''; position: absolute; right: 0; top: 6px; bottom: 6px; width: 6px;
            background: rgba(255,255,255,0.9); border-radius: 0 10px 10px 0;
        }
        .card-category:hover {
            transform: scale(1.05) translateY(-6px) rotate(-1deg);
            box-shadow: inset -5px 0 10px rgba(0,0,0,0.05), 10px 15px 20px rgba(0,0,0,0.6);
            z-index: 5;
        }

        /* 뽑기 화면 컨트롤 */
        .controls-wrapper { display: flex; justify-content: center; margin-bottom: 25px; }
        .controls { background: var(--wood-dark); padding: 15px 30px; border-radius: 40px; display: inline-flex; align-items: center; gap: 15px; z-index: 100; position: relative; color: white;}
        .controls input { font-size: 1.6rem; width: 80px; text-align: center; border: 3px solid #8d6e63; border-radius: 15px; padding: 8px; font-family: 'Jua', sans-serif; color: var(--wood-dark); }
        .controls label { font-size: 1.3rem; }

        /* 🃏 결과 영역 (5열 배치 최적화) */
        .result-grid { 
            display: flex; flex-wrap: wrap; justify-content: center; align-items: center; 
            gap: 30px; perspective: 1500px; padding-top: 10px; min-height: 550px; max-width: 1700px; margin: 0 auto;
        }
        
        @keyframes flipAppear {
            0% { opacity: 0; transform: rotateY(-180deg) scale(0.5); }
            100% { opacity: 1; transform: rotateY(0deg) scale(1); }
        }
        
        /* 🌟 세로형 카드 1.5배 확대 */
        .flip-container { 
            width: 300px; height: 420px; cursor: default; opacity: 0; 
            animation: flipAppear 0.5s ease-out forwards; 
            will-change: transform, opacity; transform: translateZ(0); 
        }
        .flip-container.horizontal { width: 420px; height: 300px; }

        /* 전부 펼치기 모드 (축소) */
        .result-grid.draw-all-mode .flip-container { width: 160px; height: 224px; }
        .result-grid.draw-all-mode .flip-container.horizontal { width: 224px; height: 160px; }
        
        .flipper { width: 100%; height: 100%; position: relative; transition: transform 0.5s ease; transform-style: preserve-3d; will-change: transform; }
        .flip-container:hover .flipper { transform: scale(1.05); } 
        
        .can-flip { cursor: pointer !important; }
        .flip-container.is-flipped .flipper { transform: rotateY(180deg); }
        .flip-container.is-flipped:hover .flipper { transform: rotateY(180deg) scale(1.05); }

        .card-front, .card-back {
            width: 100%; height: 100%; position: absolute; top: 0; left: 0;
            backface-visibility: hidden; border-radius: 20px; box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            object-fit: contain; background-color: white; padding: 10px; box-sizing: border-box;
        }
        .card-back { transform: rotateY(180deg); }

        /* 🃏 귀여운 마시멜로 '?' 카드 디자인 */
        .placeholder-card { animation: none; opacity: 1; }
        .placeholder-card .card-front {
            background: #FFF8E1; /* 따뜻한 베이지색 배경 */
            border: 10px solid #4E342E; /* 진한 갈색 테두리 */
            display: flex; flex-direction: column; justify-content: center; align-items: center; 
            border-radius: 20px; position: relative;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.05), 8px 10px 20px rgba(0,0,0,0.3); 
        }
        
        /* 안쪽 점선 테두리로 카드 느낌 뿜뿜 */
        .placeholder-card .card-front::before {
            content: ''; position: absolute; top: 8px; left: 8px; right: 8px; bottom: 8px;
            border: 3px dashed rgba(78, 52, 46, 0.3); border-radius: 10px; pointer-events: none;
        }
        
        /* 마시멜로처럼 통통한 폰트의 물음표 */
        .placeholder-card .card-front .q-mark { 
            font-size: 15rem; 
            color: #4E342E; 
            font-family: 'Dongle', sans-serif;
            text-shadow: 4px 4px 0px rgba(0,0,0,0.1); 
            z-index: 1;
            margin: 0;
            line-height: 0.5; /* 상하 여백 조절 */
        }

        /* 👩‍🏫 교사용 설정 (우드톤) */
        #teacherView { background-color: #5d4037; color: #fffaf0; padding: 30px; border-radius: 30px; text-align: left; }
        .add-card-box { display: flex; gap: 10px; margin-bottom: 25px; flex-wrap: wrap; align-items: center; }
        .add-card-box input, .add-card-box select { padding: 12px; border-radius: 12px; border: none; font-family: 'Jua', sans-serif; font-size: 1.1rem; color: #4e342e; }
        .add-card-box input[type="text"] { flex: 2; min-width: 120px; }
        .add-card-box input[type="number"] { flex: 1; min-width: 80px; }
        .add-card-box select { flex: 1; min-width: 100px; cursor: pointer; }

        .table-container { border-radius: 15px; overflow: hidden; background: #4e342e; }
        .teacher-table { width: 100%; border-collapse: collapse; color: white; font-family: 'Malgun Gothic', sans-serif;}
        .teacher-table th { background-color: #3e2723; padding: 15px; text-align: center; }
        .teacher-table td { padding: 12px; border-bottom: 1px solid #6d4c41; text-align: center; font-size: 1rem; }
        .drag-handle { cursor: grab; font-size: 1.2rem; color: #bcaaa4; padding: 0 10px; }
        .delete-btn { background-color: #ef5350; border: none; color: white; padding: 7px 15px; border-radius: 10px; cursor: pointer; font-family: 'Jua', sans-serif; }

        /* 🪞 거울카드 일괄 등록 모달 */
        #mirrorModal { display:none; position:fixed; inset:0; background:rgba(0,0,0,.7); z-index:9999; overflow-y:auto; padding:24px; }
        .mirror-box { background:#3e2723; border-radius:24px; max-width:900px; margin:0 auto; padding:28px; color:#fffaf0; }
        .mirror-box h3 { margin:0 0 16px; font-size:1.6rem; }
        .mirror-img-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(130px,1fr)); gap:12px; margin:16px 0; }
        .mirror-img-item { position:relative; border-radius:14px; overflow:hidden; border:3px solid #6d4c41; cursor:pointer; transition:.2s; }
        .mirror-img-item img { width:100%; aspect-ratio:3/4; object-fit:cover; display:block; }
        .mirror-img-item.is-front { border-color:#66bb6a; }
        .mirror-img-item.is-back  { border-color:#42a5f5; }
        .mirror-role-badge { position:absolute; bottom:0; left:0; right:0; text-align:center; font-size:.85rem; font-weight:700; padding:4px 0; }
        .mirror-img-item.is-front .mirror-role-badge { background:rgba(102,187,106,.9); color:#fff; }
        .mirror-img-item.is-back  .mirror-role-badge { background:rgba(66,165,245,.9);  color:#fff; }
        .mirror-img-item.is-none  .mirror-role-badge { background:rgba(0,0,0,.5); color:#ddd; }
        .mirror-pair-preview { display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:12px; margin-top:12px; }
        .mirror-pair-card { background:#5d4037; border-radius:14px; padding:10px; display:flex; gap:8px; align-items:center; }
        .mirror-pair-card img { width:72px; height:96px; object-fit:cover; border-radius:8px; }
        .mirror-pair-arrow { font-size:1.4rem; color:#bcaaa4; }
        .mirror-modal-btns { display:flex; gap:12px; margin-top:20px; flex-wrap:wrap; }
        .mirror-btn-primary { background:#8d6e63; color:#fff; border:none; padding:12px 28px; border-radius:20px; font-size:1.1rem; font-family:'Jua',sans-serif; cursor:pointer; box-shadow:0 4px 0 #5d4037; }
        .mirror-btn-primary:active { transform:translateY(4px); box-shadow:none; }
        .mirror-btn-cancel  { background:#4e342e; color:#bcaaa4; border:none; padding:12px 22px; border-radius:20px; font-size:1.1rem; font-family:'Jua',sans-serif; cursor:pointer; }
    </style>
</head>
<body>
    <div class="app-container">
        <header>
            <button id="backBtn" class="icon-btn hidden">◀ 서재로</button>
            <div class="title-wrap">
                <h1 id="mainTitle">생각 책방</h1>
                <button id="drawAllBtn" class="btn-draw-all-top btn-draw-all hidden">전체</button>
            </div>
            <div id="teacherHeaderBtns" style="display:none; gap:10px; align-items:center;">
                <button id="mirrorBatchBtn" class="action-btn" style="font-size:.95rem; padding:10px 18px; background:#7b5ea7; white-space:nowrap;">🪞 일괄 등록</button>
                <button id="exportBtn"      class="action-btn" style="font-size:.95rem; padding:10px 18px; background:#5d8a5e; white-space:nowrap;">📤 내보내기</button>
                <button id="importBtn"      class="action-btn" style="font-size:.95rem; padding:10px 18px; background:#5d7a8a; white-space:nowrap;">📥 불러오기</button>
                <input type="file" id="importFile" accept=".json" style="display:none;">
            </div>
            <button id="goTeacherBtn" class="setting-btn" title="카드 설정">⚙️</button>
        </header>

        <main>
            <section id="studentLobby">
                <div style="display:flex; align-items:center; gap:0;">
                    <button id="lobbyPrevBtn" onclick="lobbyChangePage(-1)" style="display:none; background:none; border:none; font-size:3.5rem; color:#8d6e63; cursor:pointer; padding:0 12px; line-height:1; transition:.2s; flex-shrink:0;" onmouseover="this.style.color='#4e342e'" onmouseout="this.style.color='#8d6e63'">‹</button>
                    <div id="cardGrid" class="grid-container" style="flex:1;"></div>
                    <button id="lobbyNextBtn" onclick="lobbyChangePage(1)"  style="display:none; background:none; border:none; font-size:3.5rem; color:#8d6e63; cursor:pointer; padding:0 12px; line-height:1; transition:.2s; flex-shrink:0;" onmouseover="this.style.color='#4e342e'" onmouseout="this.style.color='#8d6e63'">›</button>
                </div>
            </section>

            <section id="drawView" class="hidden">
                <div class="controls-wrapper">
                    <div class="controls">
                        <label>찾을 장수:</label>
                        <input type="number" id="drawCount" value="1" min="1">
                        <span id="remainInfo" style="display:none; font-size:1.1rem; color:#ffe0b2;"></span>
                        <button id="drawBtn" class="action-btn">뽑기</button>
                    </div>
                </div>
                <div id="resultArea" class="result-grid"></div>
            </section>

            <section id="teacherView" class="hidden">
                <div>
                    <h2 style="font-family:'Jua'; margin-top:0;">카드 설정</h2>
                    <div id="loadWarnBar" style="display:none; background:#c62828; color:#fff; padding:12px 16px; border-radius:12px; margin-bottom:14px; font-size:1rem; line-height:1.5;"></div>
                    <div class="add-card-box">
                            <input type="text" id="newCardName" placeholder="표시 이름 (예: 도란도란)">
                            <input type="text" id="newCardFolder" placeholder="폴더명">
                            <select id="newCardOrientation">
                                <option value="vertical">세로형 ↕</option>
                                <option value="horizontal">가로형 ↔</option>
                            </select>
                            <input type="number" id="newCardTotal" placeholder="장수">
                            <button id="addCardBtn" class="action-btn" style="font-size:1rem; padding:10px 20px;">저장</button>
                            <button id="cancelEditBtn" class="icon-btn hidden" style="background:#666;">취소</button>
                        </div>
                    <div class="table-container">
                        <table class="teacher-table">
                            <thead>
                                <tr><th style="width:40px;">순서</th><th>표시 이름</th><th>폴더명</th><th>형태</th><th>장수</th><th style="width:60px;">보이기</th><th style="width:80px;">뽑기</th><th style="width:60px;">관리</th></tr>
                            </thead>
                            <tbody id="cardManageList"></tbody>
                        </table>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <!-- 🪞 거울카드 일괄 등록 모달 -->
    <div id="mirrorModal">
        <div class="mirror-box">
            <h3>🪞 거울카드 일괄 등록</h3>
            <div style="display:flex; gap:12px; flex-wrap:wrap; align-items:center; margin-bottom:12px;">
                <input type="text" id="mirrorCardName" placeholder="카드 이름 (예: 거울카드)" style="padding:10px 14px; border-radius:12px; border:none; font-family:'Jua',sans-serif; font-size:1.1rem; color:#4e342e; flex:1; min-width:140px;">
                <input type="text" id="mirrorCardFolder" placeholder="GitHub 폴더명 (예: 거울카드)" style="padding:10px 14px; border-radius:12px; border:none; font-family:'Jua',sans-serif; font-size:1.1rem; color:#4e342e; flex:1; min-width:140px;">
                <select id="mirrorCardOrientation" style="padding:10px 14px; border-radius:12px; border:none; font-family:'Jua',sans-serif; font-size:1.1rem; color:#4e342e;">
                    <option value="vertical">세로형 ↕</option>
                    <option value="horizontal">가로형 ↔</option>
                </select>
            </div>
            <p style="font-size:.85rem; color:#bcaaa4; margin:0 0 10px;">💡 이미지를 GitHub 폴더에 업로드한 뒤, 폴더명을 입력하고 같은 파일들을 선택하세요.</p>
            <label style="display:inline-block; background:#8d6e63; color:#fff; padding:10px 22px; border-radius:20px; cursor:pointer; font-size:1rem; font-family:'Jua',sans-serif; box-shadow:0 4px 0 #5d4037;">
                📁 이미지 선택 (여러 장)
                <input type="file" id="mirrorFileInput" accept="image/*" multiple style="display:none;" onchange="handleMirrorFiles(this.files)">
            </label>
            <p style="font-size:.9rem; color:#bcaaa4; margin:10px 0 4px;">이미지를 클릭해서 <span style="color:#a5d6a7;">앞면</span> / <span style="color:#90caf9;">뒷면</span>을 지정하세요.</p>
            <div id="mirrorImgGrid" class="mirror-img-grid"></div>
            <div id="mirrorPairSection" style="display:none;">
                <p style="font-weight:700; margin:16px 0 8px; font-size:1rem;">📌 짝 미리보기 <span id="mirrorPairCount" style="color:#bcaaa4; font-size:.9rem;"></span></p>
                <div id="mirrorPairPreview" class="mirror-pair-preview"></div>
            </div>
            <div class="mirror-modal-btns">
                <button class="mirror-btn-primary" onclick="saveMirrorCard()">✅ 등록하기</button>
                <button class="mirror-btn-cancel" onclick="closeMirrorModal()">취소</button>
            </div>
            <p id="mirrorStatus" style="margin-top:12px; font-size:.9rem; color:#a5d6a7;"></p>
        </div>
    </div>

    <script>
// 폰트가 모두 다운로드되면 화면을 부드럽게 띄움
        document.fonts.ready.then(() => document.body.classList.add('fonts-loaded'));
        // --- 1. Cloudflare KV API ---
        const API_BASE = 'https://card.csgo0404.workers.dev/api';
        const API = API_BASE + '/cards';
        let adminPw = '';

        // 서버에서 한 번이라도 정상 수신했는가. 이게 false 인 동안은 저장을 금지한다.
        // (캐시/빈 배열을 서버로 되돌려써서 전체 카드가 날아가는 사고를 막는 잠금)
        let serverLoaded = false;
        let lastLoadError = '';
        let _saving = false;

        // 헤더 값은 ASCII 만 실을 수 있다(한글 비밀번호를 그대로 넣으면 fetch 가 TypeError).
        // ASCII 면 예전 그대로 보내고, 아니면 인코딩한 뒤 x-auth-enc 로 알린다.
        function authHeaders(pw) {
            const h = {};
            if (/^[ -~]*$/.test(pw)) { h['x-auth'] = pw; }
            else { h['x-auth'] = encodeURIComponent(pw); h['x-auth-enc'] = '1'; }
            return h;
        }

        function updateSaveLock() {
            ['addCardBtn', 'mirrorBatchBtn', 'importBtn'].forEach(id => {
                const el = document.getElementById(id);
                if (el) el.disabled = !serverLoaded;
            });
            const bar = document.getElementById('loadWarnBar');
            if (!bar) return;
            bar.style.display = serverLoaded ? 'none' : 'block';
            if (!serverLoaded) {
                bar.textContent = '⚠ 서버에서 카드 목록을 아직 불러오지 못했습니다. 지금 저장하면 기존 카드가 지워질 수 있어 저장을 잠갔습니다. (' + (lastLoadError || '연결 확인 중') + ')';
            }
        }

        // 배열이기만 하면 통과시키면 안 된다 — 문자열 배열 같은 쓰레기가 들어와도
        // serverLoaded 가 열려 저장 잠금이 풀린다. 원소 모양까지 본다.
        function isCardArray(v) {
            return Array.isArray(v) && v.every(c => c && typeof c === 'object' && !Array.isArray(c) && c.id);
        }

        // 마지막으로 읽은 서버본의 지문. 저장할 때 If-Match 로 되돌려 보내
        // "내가 본 것 위에만 쓴다"를 서버가 확인하게 한다(옛 워커는 이 헤더를 무시하므로 안전).
        let _serverEtag = '';

        // 실패를 빈 배열로 둔갑시키지 않는다. 반드시 throw 해서 호출부가 캐시를 지키게 한다.
        async function fetchCards() {
            const r = await fetch(API);
            if (!r.ok) throw new Error('HTTP ' + r.status);
            const j = await r.json();
            if (!isCardArray(j)) throw new Error('응답 형식 오류');
            const etag = r.headers && r.headers.get ? (r.headers.get('etag') || '') : '';
            return { list: j, etag };
        }
        async function saveCards(arr) {
            if (!serverLoaded) {
                alert('아직 서버에서 카드 목록을 불러오지 못했어요. 새로고침 후 다시 시도해 주세요.');
                throw new Error('server not loaded');
            }
            if (!Array.isArray(arr)) throw new Error('bad arg');
            if (!adminPw) {
                alert('비밀번호가 필요합니다. ⚙ 설정을 다시 열어 입력해 주세요.');
                throw new Error('no credential');
            }
            if (_saving) { alert('아직 저장 중이에요. 잠시 뒤 다시 눌러 주세요.'); throw new Error('saving in progress'); }
            _saving = true;
            let r;
            try {
                const headers = { 'content-type': 'application/json', ...authHeaders(adminPw) };
                if (_serverEtag) headers['if-match'] = _serverEtag;
                r = await fetch(API, {
                    method: 'PUT',
                    headers,
                    body: JSON.stringify(arr)
                });
            } catch (e) {
                // 연결이 끊기면 여기로 온다. 안내하지 않으면 호출부가 조용히 삼켜
                // "눌렀는데 아무 일도 안 일어남" 이 된다.
                alert('서버에 연결하지 못해 저장하지 못했습니다. 연결을 확인하고 다시 시도해 주세요.');
                throw e;
            } finally {
                _saving = false;
            }
            if (!r.ok) {
                // 워커가 주는 error 코드로 원인을 구분한다. 숫자만 보여주면 교사가 손쓸 수가 없다.
                let code = '';
                try { const j = await r.json(); code = (j && j.error) || ''; } catch (e) {}

                if (code === 'empty_refused') {
                    alert('카드를 전부 지우는 저장이라 안전을 위해 막았습니다. 정말 비우려면 하나씩 삭제해 주세요.');
                    throw new Error('empty refused');
                }
                if (code === 'conflict' || (r.status === 409 && !code)) {
                    // 다른 기기/탭이 먼저 저장했다. 덮어쓰지 않고 최신본을 다시 받는다.
                    alert('다른 기기에서 먼저 저장했어요. 최신 목록을 다시 불러옵니다. 방금 변경한 내용을 확인하고 다시 저장해 주세요.');
                    await reloadCards();
                    throw new Error('conflict');
                }
                if (r.status === 403) {
                    adminPw = '';
                    // 설정 화면에 남겨두면 빈 비밀번호로 계속 요청해 경고창이 반복된다.
                    // 로비로 돌려보내 ⚙ 로 다시 입력받는다.
                    closeMirrorModal();   // 로비 위에 모달만 남는 것을 막는다
                    toggleView('studentLobby');
                    mainTitle.textContent = "생각 책방";
                    resetForm();
                    alert('비밀번호가 맞지 않아 저장하지 못했습니다. ⚙ 설정을 다시 열어 비밀번호를 입력해 주세요.');
                    throw new Error('forbidden');
                }
                if (r.status === 429) {
                    alert('잠시 후 다시 시도해 주세요. (요청이 너무 잦습니다)');
                    throw new Error('rate limited');
                }
                if (r.status === 413) {
                    alert('저장할 내용이 너무 큽니다.');
                    throw new Error('too large');
                }
                alert('저장 실패: ' + r.status + (code ? ' (' + code + ')' : ''));
                throw new Error('save failed');
            }
            // 저장 응답의 지문으로 갱신해 두면, 연달아 저장할 때 다시 읽지 않아도 된다.
            const newEtag = r.headers && r.headers.get ? r.headers.get('etag') : null;
            _serverEtag = newEtag || '';
            // 저장 성공 시에만 메모리/캐시에 반영한다(실패 시 롤백 불필요).
            cardSettings = arr;
            try {
                localStorage.setItem('cookieClassCachedCards', JSON.stringify(arr));
            } catch (e) {
                console.warn('로컬 캐시 저장 실패(서버 저장은 성공)', e);
            }
            renderLobby();
            renderTable();
        }
        function newId() {
            return (crypto.randomUUID ? crypto.randomUUID() : 'c' + Date.now() + Math.random().toString(36).slice(2,8));
        }

        // 🎵 2. 효과음 (웹 오디오 API)
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx;

        function initAudio() {
            if (!audioCtx) audioCtx = new AudioContext();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function playSimultaneousDrawSound() {
            initAudio();
            const now = audioCtx.currentTime;
            const freqs = [523.25, 659.25, 783.99, 1046.50, 1318.51, 1567.98]; 
            freqs.forEach((freq, index) => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, now + (index * 0.05));
                gain.gain.setValueAtTime(0, now + (index * 0.05));
                gain.gain.linearRampToValueAtTime(0.15, now + (index * 0.05) + 0.02);
                gain.gain.exponentialRampToValueAtTime(0.01, now + (index * 0.05) + 0.8);
                osc.start(now + (index * 0.05));
                osc.stop(now + (index * 0.05) + 0.8);
            });
        }

        function playFlipSound() {
            initAudio();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.type = 'triangle'; 
            osc.frequency.setValueAtTime(1200, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(2200, audioCtx.currentTime + 0.1); 
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            osc.start(); osc.stop(audioCtx.currentTime + 0.3);
        }

        let _sortable = null;    // 표 드래그 정렬 인스턴스(렌더마다 교체)
        // 덱별로 '이미 뽑힌 번호'. 새로고침하면 사라진다(메모리에만 둔다).
        const _drawnByDeck = Object.create(null);
        let _drawToken = 0;      // 진행 중인 뽑기 식별(덱 이동·연타 시 무효화)
        let cardSettings = [];   // KV 카드 (서버)
        let editingId = null;
        let currentCard = null;
        let isDrawAllClicked = false;
        let lobbyPage = 0;
        const LOBBY_PER_PAGE = 10;

        // (옛 base64 거울카드용 IndexedDB 계층은 제거했다 —
        //  지금 거울카드는 파일명만 저장하며, 이 계층은 한 번도 실행되지 않았다)


        const mainTitle = document.getElementById('mainTitle');
        const cardGrid = document.getElementById('cardGrid');
        const cardManageList = document.getElementById('cardManageList');
        const resultArea = document.getElementById('resultArea');
        const drawCountInput = document.getElementById('drawCount');

        // --- 3. 캐시 및 데이터 동기화 ---
        // 캐시가 깨져 있어도 앱은 떠야 한다. 예전엔 여기서 throw 하면 스크립트가 통째로 죽어
        // 로비조차 안 뜨는 백지 화면이 됐다.
        const cachedCards = localStorage.getItem('cookieClassCachedCards');
        if (cachedCards) {
            try {
                const parsed = JSON.parse(cachedCards);
                if (!isCardArray(parsed)) throw new Error('캐시 형식 오류');
                cardSettings = parsed;
                cardSettings.sort((a, b) => (a.order || 0) - (b.order || 0));
                renderLobby();
                renderTable();
            } catch (e) {
                console.warn('로컬 캐시가 손상되어 폐기합니다', e);
                try { localStorage.removeItem('cookieClassCachedCards'); } catch (e2) {}
                cardSettings = [];
            }
        }

        let _reloadSeq = 0;          // 응답이 순서 바뀌어 도착해도 최신만 반영한다
        let _reloadApplied = 0;

        async function reloadCards() {
            const seq = ++_reloadSeq;
            let got, fresh;
            try {
                got = await fetchCards();
                fresh = got.list;
            } catch (e) {
                // 실패 시 캐시도 화면도 절대 건드리지 않는다.
                lastLoadError = e && e.message ? e.message : String(e);
                console.warn('카드 목록 불러오기 실패 — 로컬 캐시 유지', e);
                updateSaveLock();
                renderLobby();   // 캐시가 없으면 로비가 통째로 비어 있어 안내조차 못 본다
                return false;
            }
            // 느린 옛 응답이 뒤늦게 도착해 최신 데이터를 덮는 것을 막는다.
            if (seq <= _reloadApplied) {
                console.warn('오래된 응답 무시(seq ' + seq + ' <= ' + _reloadApplied + ')');
                return false;
            }
            _reloadApplied = seq;
            _serverEtag = got.etag;   // 채택하는 응답의 지문만 신뢰한다

            // 서버가 빈 배열을 주는데 우리에겐 카드가 있다면, 그대로 받아들이면 안 된다.
            // (KV 키 유실·초기화 사고) 화면은 유지하고 저장은 잠근 채 교사에게 알린다.
            if (fresh.length === 0 && cardSettings.length > 0) {
                serverLoaded = false;
                lastLoadError = '서버 목록이 비어 있음 — 기존 카드를 덮어쓰지 않도록 저장을 잠갔습니다';
                console.warn(lastLoadError);
                updateSaveLock();
                return false;
            }

            fresh.sort((a, b) => (a.order || 0) - (b.order || 0));
            cardSettings = fresh;
            serverLoaded = true;      // 캐시 쓰기보다 먼저. setItem 이 실패해도 앱은 살아야 한다.
            lastLoadError = '';
            const freshJson = JSON.stringify(fresh);
            try {
                if (freshJson !== localStorage.getItem('cookieClassCachedCards')) {
                    localStorage.setItem('cookieClassCachedCards', freshJson);
                }
            } catch (e) {
                // 용량초과·사파리 프라이빗·저장차단. 캐시는 포기하되 동작은 계속한다.
                console.warn('로컬 캐시 저장 실패(무시하고 진행)', e);
            }
            updateSaveLock();
            renderLobby();
            renderTable();
            return true;
        }
        updateSaveLock();
        reloadCards();

        // 카드 이름·폴더명은 서버(KV)에서 오고, 비밀번호를 아는 누구나 바꿀 수 있다.
        // 이스케이프 없이 innerHTML 에 넣으면 이름 하나로 전교생 브라우저에서 코드가 실행된다.
        function esc(v) {
            return String(v == null ? '' : v)
                .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }

        function renderLobby() {
            const visible = cardSettings.filter(c => !isFlagOn(c.hidden));
            const totalPages = Math.max(1, Math.ceil(visible.length / LOBBY_PER_PAGE));
            if (lobbyPage >= totalPages) lobbyPage = totalPages - 1;
            const page = visible.slice(lobbyPage * LOBBY_PER_PAGE, (lobbyPage + 1) * LOBBY_PER_PAGE);

            if (visible.length === 0) {
                // 왜 비었는지 알려준다. 아무 말 없이 빈 책장만 보이면 학생도 교사도 원인을 모른다.
                const msg = !serverLoaded
                    ? '지금 카드 목록을 불러오지 못했어요.<br>인터넷 연결을 확인하고 새로고침해 주세요.'
                    : (cardSettings.length === 0
                        ? '아직 준비된 카드가 없어요.<br>선생님께 알려 주세요.'
                        : '지금은 열어 둔 카드가 없어요.<br>선생님께 알려 주세요.');
                cardGrid.innerHTML =
                    `<div style="grid-column:1/-1; align-self:center; text-align:center; color:#f4ece1;
                                 font-size:2rem; line-height:1.6; padding:40px 20px; text-shadow:1px 1px 3px rgba(0,0,0,.5);">
                        ${msg}
                     </div>`;
                document.getElementById('lobbyPrevBtn').style.display = 'none';
                document.getElementById('lobbyNextBtn').style.display = 'none';
                return;
            }

            // onclick 에 id 를 문자열로 끼워 넣지 않는다(따옴표가 든 id 가 속성을 깨뜨렸다).
            cardGrid.innerHTML = page.map(c =>
                `<div class="card-category" data-id="${esc(c.id)}">${esc(c.name)}</div>`
            ).join('');
            const usePaging = visible.length > LOBBY_PER_PAGE;
            document.getElementById('lobbyPrevBtn').style.display = usePaging ? 'block' : 'none';
            document.getElementById('lobbyNextBtn').style.display = usePaging ? 'block' : 'none';
            document.getElementById('lobbyPrevBtn').style.opacity = lobbyPage === 0 ? '0.3' : '1';
            document.getElementById('lobbyNextBtn').style.opacity = lobbyPage === totalPages - 1 ? '0.3' : '1';
        }

        // 로비/표의 클릭은 위임으로 처리한다(핸들러 중복 부착 없음, 주입 경로 없음).
        cardGrid.addEventListener('click', e => {
            const el = e.target.closest('.card-category');
            if (el && el.dataset.id) startDraw(el.dataset.id);
        });
        cardManageList.addEventListener('click', e => {
            const tr = e.target.closest('tr');
            if (!tr || !tr.dataset.id) return;
            const id = tr.dataset.id;
            const btn = e.target.closest('button[data-act]');
            if (!btn) { startEdit(id); return; }
            e.stopPropagation();
            if (btn.dataset.act === 'hide')  toggleCardHidden(id);
            else if (btn.dataset.act === 'norepeat') toggleNoRepeat(id);
            else if (btn.dataset.act === 'pairs') openMirrorModal(id);
            else if (btn.dataset.act === 'del')   deleteCard(id);
        });

        function lobbyChangePage(dir) {
            const visible = cardSettings.filter(c => !isFlagOn(c.hidden));
            const totalPages = Math.ceil(visible.length / LOBBY_PER_PAGE);
            lobbyPage = Math.max(0, Math.min(totalPages - 1, lobbyPage + dir));
            renderLobby();
        }

        function renderTable() {
            // 렌더마다 Sortable 이 쌓이면 드래그 한 번에 저장이 여러 번 나간다.
            if (_sortable) { try { _sortable.destroy(); } catch (e) {} _sortable = null; }
            cardManageList.innerHTML = cardSettings.map((c) => `
                <tr data-id="${esc(c.id)}" style="${isFlagOn(c.hidden) ? 'opacity:.5;' : ''}">
                    <td class="drag-handle">☰</td>
                    <td>${esc(c.name)}</td>
                    <td>${esc(c.folder || '')}</td>
                    <td><span style="background:${c.customPairs ? '#7b5ea7' : '#8d6e63'}; padding:3px 8px; border-radius:10px; font-size:0.9rem;">${c.orientation === 'horizontal' ? '가로 ↔' : '세로 ↕'}</span></td>
                    <td>${esc(c.totalImages)}장</td>
                    <td style="text-align:center;">
                        <button data-act="hide"
                            style="background:${isFlagOn(c.hidden) ? '#6d4c41' : '#66bb6a'}; border:none; color:#fff; padding:5px 12px; border-radius:10px; cursor:pointer; font-family:'Jua',sans-serif; font-size:.85rem;">
                            ${isFlagOn(c.hidden) ? '숨김' : '보임'}
                        </button>
                    </td>
                    <td style="text-align:center;">
                        <button data-act="norepeat"
                            style="background:${deckNoRepeat(c) ? '#5c6bc0' : '#8d6e63'}; border:none; color:#fff; padding:5px 10px; border-radius:10px; cursor:pointer; font-family:'Jua',sans-serif; font-size:.85rem;">
                            ${deckNoRepeat(c) ? '제외' : '랜덤'}
                        </button>
                    </td>
                    <td style="white-space:nowrap;">
                        ${c.customPairs ? `<button data-act="pairs" style="background:#7b5ea7; border:none; color:#fff; padding:5px 10px; border-radius:8px; cursor:pointer; font-family:'Jua',sans-serif; font-size:.8rem; margin-right:4px;">짝 수정</button>` : ''}
                        <button class="delete-btn" data-act="del">삭제</button>
                    </td>
                </tr>
            `).join('');
            _sortable = new Sortable(cardManageList, { handle: '.drag-handle', animation: 150, onEnd: saveNewOrder });
        }

        // 뽑기 방식 토글. 매 뽑기가 독립이면 40장에서 3장을 뽑을 때
        // 5번에 1번꼴로 직전 카드가 다시 나온다(실측 22%).
        // 덱 성격에 따라 그게 괜찮기도 하고 활동을 망치기도 해서 덱마다 고르게 한다.
        async function toggleNoRepeat(id) {
            if (!cardSettings.some(c => c.id === id)) return;
            const next = cardSettings.map(c => c.id === id ? { ...c, noRepeat: !deckNoRepeat(c) } : c);
            try { await saveCards(next); } catch (e) { renderTable(); }
        }

        async function toggleCardHidden(id) {
            if (!cardSettings.some(c => c.id === id)) return;
            // 원본을 먼저 고치지 않는다 — 저장이 실패해도 '유령 변경'이 남지 않게.
            const next = cardSettings.map(c => c.id === id ? { ...c, hidden: !isFlagOn(c.hidden) } : c);
            try { await saveCards(next); } catch (e) { renderTable(); }
        }

        async function saveNewOrder() {
            const rows = [...cardManageList.querySelectorAll('tr')];
            const idOrder = new Map(rows.map((row, index) => [row.getAttribute('data-id'), index]));
            const next = cardSettings
                .map(c => idOrder.has(c.id) ? { ...c, order: idOrder.get(c.id) } : { ...c })
                .sort((a, b) => (a.order || 0) - (b.order || 0));
            // 실패하면 화면 순서를 서버/메모리 기준으로 되돌린다.
            try { await saveCards(next); } catch (e) { renderTable(); }
        }

        function toggleView(viewId) {
            ['studentLobby', 'drawView', 'teacherView'].forEach(id => document.getElementById(id).classList.add('hidden'));
            document.getElementById(viewId).classList.remove('hidden');

            document.getElementById('backBtn').classList.toggle('hidden', viewId === 'studentLobby');
            document.getElementById('goTeacherBtn').classList.toggle('hidden', viewId !== 'studentLobby');
            document.getElementById('drawAllBtn').classList.toggle('hidden', viewId !== 'drawView');
            document.getElementById('teacherHeaderBtns').style.display = viewId === 'teacherView' ? 'flex' : 'none';
        }

        // --- 4. 대기 화면 설정 및 강력한 Preload ---
        function startDraw(id) {
            const found = cardSettings.find(c => c.id === id);
            if (!found) { renderLobby(); return; }
            if (needsFolder(found) && !deckFolder(found)) {
                alert('이 카드에 폴더가 지정되지 않았습니다. 선생님께 알려 주세요.');
                return;
            }
            _drawToken++;   // 이전 덱의 진행 중인 뽑기를 버린다
            currentCard = found;
            mainTitle.textContent = currentCard.name;
            drawCountInput.value = 1; 
            drawCountInput.max = deckSize(currentCard); 
            
            toggleView('drawView');
            updatePlaceholders();
            updateRemainInfo(); 
            
            // 🔥 마법: 덱을 선택하자마자 이미지를 미리 몰래 다운로드합니다!
            preloadImages(currentCard); 
        }

        // 폴더별 파일명 패턴(공백 유무) 캐시
        function getPatternKey(folder) { return 'cardPattern_' + folder; }
        function getCachedPattern(folder) { return localStorage.getItem(getPatternKey(folder)); }
        function setCachedPattern(folder, p) { localStorage.setItem(getPatternKey(folder), p); }
        // 뒷면은 앞면과 규칙이 다를 수 있다(감정카드: 앞 plain / 뒤 spaced).
        function getBackKey(folder) { return 'cardBackPattern_' + folder; }
        function getCachedBack(folder) { return localStorage.getItem(getBackKey(folder)); }
        function setCachedBack(folder, p) { localStorage.setItem(getBackKey(folder), p); }

        // 패턴 감지: 실제로 '로드에 성공한' 쪽만 캐시한다.
        // 예전 코드는 첫 요청 실패(오프라인·일시 404)를 곧바로 'plain' 으로 영구 저장해서
        // 그 기기에서는 해당 덱이 영원히 안 뜨는 상태로 굳어버렸다.
        function _probeImg(url) {
            return new Promise(resolve => {
                const img = new Image();
                img.onload = () => resolve(true);
                img.onerror = () => resolve(false);
                img.src = url;
            });
        }
        async function detectPattern(card) {
            const folder = deckFolder(card);
            if (!folder) return 'plain';   // 확인할 경로가 없으면 요청을 만들지 않는다
            const cached = getCachedPattern(folder);
            if (cached) return cached;
            const f = encodeURIComponent(folder);
            if (await _probeImg(`./${f}/%20(1).webp`)) {
                setCachedPattern(folder, 'spaced');
                return 'spaced';
            }
            if (await _probeImg(`./${f}/(1).webp`)) {
                setCachedPattern(folder, 'plain');
                return 'plain';
            }
            return 'plain';   // 둘 다 확인 실패 — 캐시하지 않는다(다음 진입 때 재시도)
        }

        // 뒷면 패턴을 폴더당 딱 한 번 확인해 캐시한다.
        // 'none' 은 뒷면이 아예 없다는 뜻(hasBack 이 없는 옛 카드용).
        async function detectBackPattern(folder, frontPattern, knownHasBack) {
            if (!folder) return 'none';
            const cached = getCachedBack(folder);
            if (cached) return cached;
            const f = encodeURIComponent(folder);
            if (await _probeImg(`./${f}/뒷면%20(1).webp`)) { setCachedBack(folder, 'spaced'); return 'spaced'; }
            if (await _probeImg(`./${f}/뒷면(1).webp`))    { setCachedBack(folder, 'plain');  return 'plain';  }

            // 둘 다 실패했다. '뒷면이 없다' 와 '지금 네트워크가 안 된다' 를 구분해야 한다.
            // 앞면 패턴에서 겪었던 그 사고 — 일시 장애를 영구 캐시하면 회복할 길이 없다.
            if (knownHasBack) return 'none';   // 서버가 있다고 했으니 캐시하지 않는다(다음에 재시도)
            const reachable = await _probeImg(buildFrontUrl(folder, 1, frontPattern));
            if (reachable) setCachedBack(folder, 'none');   // 폴더는 멀쩡한데 뒷면만 없다 → 확정
            return 'none';
        }

        function buildFrontUrl(folder, n, pattern) {
            const f = encodeURIComponent(folder);
            return pattern === 'spaced' ? `./${f}/%20(${n}).webp` : `./${f}/(${n}).webp`;
        }
        // 서버 데이터의 hasBack 을 실제로 사용한다(문자열 'false'/'true' 로 저장돼 있다).
        // 값이 없는 옛 카드만 예전처럼 요청해 보고 판단한다.
        function cardHasBack(card) {
            const v = card && card.hasBack;
            if (v === false || v === 'false') return false;
            if (v === true  || v === 'true')  return true;
            return true;   // 미지정 = 알 수 없음 → 종전대로 시도
        }
        function buildBackUrl(folder, n, pattern) {
            const f = encodeURIComponent(folder);
            return pattern === 'spaced' ? `./${f}/뒷면%20(${n}).webp` : `./${f}/뒷면(${n}).webp`;
        }

        // 이미지 미리 불러오기 — 동시 6장씩 순차 큐.
        // 예전에는 100장을 한 번에 요청해서 저사양 기기가 멎고, 덱을 빠르게 갈아타면
        // 취소되지 않은 요청이 계속 쌓였다. 토큰으로 이전 덱의 큐를 중단시킨다.
        let _preloadToken = 0;
        const PRELOAD_CONCURRENCY = 6;
        // 미리 받아 둘 총 픽셀 예산(약 24MP ≈ 디코딩 96MB). 그림이 클수록 적게 받는다.
        const PRELOAD_PIXEL_BUDGET = 24 * 1000 * 1000;
        const PRELOAD_FALLBACK_COUNT = 12;
        // 이 장수를 넘겨 뽑으면 화면 밖 카드는 지연 로딩한다(한 화면에 대략 이 정도가 들어간다)
        const LAZY_THRESHOLD = 10;

        // 미리 받아 둔 이미지를 놓아준다. 토큰은 '더 받지 마라'일 뿐이라
        // 이미 받은 것들은 이 영역에 남아 디코딩된 메모리를 계속 차지한다.
        function clearPreload() {
            const d = document.getElementById('hidden-preload-area');
            if (d) d.innerHTML = '';
        }

        async function preloadImages(card) {
            const myToken = ++_preloadToken;
            const folder = deckFolder(card);   // 탐지·요청 모두 이 값 하나만 쓴다
            if (!folder) return;               // 경로가 없으면 미리 받을 것도 없다
            const pattern = await detectPattern(card);
            if (myToken !== _preloadToken) return;   // 그 사이 다른 덱으로 이동

            let hiddenDiv = document.getElementById('hidden-preload-area');
            if(!hiddenDiv) {
                hiddenDiv = document.createElement('div');
                hiddenDiv.id = 'hidden-preload-area';
                hiddenDiv.style.display = 'none';
                document.body.appendChild(hiddenDiv);
            }
            hiddenDiv.innerHTML = '';

            const total = deckSize(card);

            // 저사양 태블릿에서 진짜 위험한 건 전송량이 아니라 '디코딩된 메모리'다.
            // 1760x2527 짜리 그림 한 장은 화면에 작게 보여도 메모리에서는 약 17MB 를 쓴다.
            // 덱 전체를 미리 받으면 수백 MB 를 한꺼번에 디코딩하려다 탭이 죽는다.
            // 그림 자체는 손대지 않고, '미리 받는 장수'만 그림 크기에 맞춰 줄인다.
            const first = new Image();
            first.decoding = 'async';
            await new Promise(res => {
                first.onload = res; first.onerror = res;
                first.src = buildFrontUrl(folder, 1, pattern);
                hiddenDiv.appendChild(first);
            });
            if (myToken !== _preloadToken) return;

            const px = (first.naturalWidth || 0) * (first.naturalHeight || 0);
            // 크기를 알 수 없으면(오래된 브라우저 등) 보수적으로 조금만 받는다.
            const budget = px > 0
                ? Math.floor(PRELOAD_PIXEL_BUDGET / px)
                : PRELOAD_FALLBACK_COUNT;
            const limit = Math.max(1, Math.min(total, budget));

            let next = 2;   // 1번은 위에서 이미 받았다
            const runner = () => new Promise(done => {
                const step = () => {
                    if (myToken !== _preloadToken || next > limit) return done();
                    const n = next++;
                    const img = new Image();
                    img.decoding = 'async';
                    img.onload = step;
                    img.onerror = step;
                    img.src = buildFrontUrl(folder, n, pattern);
                    hiddenDiv.appendChild(img);
                };
                step();
            });
            const lanes = Math.max(1, Math.min(PRELOAD_CONCURRENCY, limit - 1));
            if (limit > 1) await Promise.all(Array.from({ length: lanes }, runner));
        }

        drawCountInput.addEventListener('input', updatePlaceholders);

        // 덱별 '이미 뽑힌 번호'를 꺼낸다.
        // 교사가 장수를 줄이면(40 → 10) 범위를 벗어난 옛 번호가 남아
        // '남은 카드 0장' + 매 뽑기마다 재섞기 안내가 뜬다. 꺼낼 때 정리한다.
        function drawnSetFor(card) {
            if (!card || !card.id) return null;
            const set = _drawnByDeck[card.id] || (_drawnByDeck[card.id] = new Set());
            const total = deckSize(card);
            set.forEach(n => { if (n < 1 || n > total) set.delete(n); });
            return set;
        }

        // '제외' 덱에서만 남은 장수를 보여준다. 다 떨어지기 전에 눈치챌 수 있게.
        function updateRemainInfo() {
            const el = document.getElementById('remainInfo');
            if (!el) return;
            if (!currentCard || !deckNoRepeat(currentCard)) { el.style.display = 'none'; return; }
            const used = (drawnSetFor(currentCard) || { size: 0 }).size;
            const left = Math.max(0, deckSize(currentCard) - used);
            el.style.display = '';
            el.textContent = '남은 카드 ' + left + '장';
        }

        function updatePlaceholders() {
            if(!currentCard) return;
            let count = parseInt(drawCountInput.value);
            if(isNaN(count) || count < 1) count = 1;
            if(count > deckSize(currentCard)) count = deckSize(currentCard);

            resultArea.innerHTML = '';
            if(count > 10) resultArea.classList.add('draw-all-mode');
            else resultArea.classList.remove('draw-all-mode');

            const isHorizontal = currentCard.orientation === 'horizontal';

            for(let i=0; i<count; i++) {
                const container = document.createElement('div');
                container.className = `flip-container placeholder-card ${isHorizontal ? 'horizontal' : ''}`;
                container.innerHTML = `
                    <div class="flipper">
                        <div class="card-front">
                            <span class="q-mark">?</span>
                        </div>
                    </div>
                `;
                resultArea.appendChild(container);
            }
        }

        // 🔒 비밀번호는 소스에 두지 않는다. 정답은 Cloudflare 시크릿(TEACHER_PW)만 알고,
        //    맞는지는 워커가 판정한다. 예전엔 여기에 정답이 적혀 있어 학생이 소스보기만 해도 알 수 있었다.
        document.getElementById('goTeacherBtn').onclick = async () => {
            const pw = prompt("비밀번호를 입력하세요.");
            if (!pw) return;
            let allow = false, offline = false;
            try {
                const r = await fetch(API_BASE + '/auth', { headers: authHeaders(pw) });
                if (r.status === 404) {
                    // 판정 엔드포인트가 없는 옛 워커에서만 통과시킨다(잠금 방지).
                    allow = true;
                } else if (r.status === 429) {
                    alert('비밀번호 시도가 너무 잦습니다. 잠시 후 다시 해 주세요.');
                    return;
                } else {
                    allow = r.ok;
                }
            } catch (e) {
                // 네트워크 오류를 통과로 취급하면, 요청을 일부러 끊어 교사 화면에 들어올 수 있다.
                offline = true;
            }
            if (offline) { alert('서버에 연결하지 못해 확인할 수 없습니다. 연결을 확인하고 다시 시도해 주세요.'); return; }
            if (!allow) { alert("비밀번호가 일치하지 않습니다."); return; }
            adminPw = pw;
            toggleView('teacherView');
            mainTitle.textContent = "카드 설정";
            if (!serverLoaded) reloadCards();
        };
        document.getElementById('backBtn').onclick = () => {
            _drawToken++;   // 로비로 나가면 진행 중인 뽑기도 버린다
            _preloadToken++;
            clearPreload();
            resultArea.innerHTML = '';   // 뽑아 놓은 카드도 놓아준다(전체 100장이면 수백 MB)
            const _ri = document.getElementById('remainInfo');
            if (_ri) _ri.style.display = 'none';
            toggleView('studentLobby'); mainTitle.textContent = "생각 책방"; resetForm();
        };

        document.getElementById('addCardBtn').onclick = async () => {
            const name = document.getElementById('newCardName').value.trim();
            const editingCard = editingId && cardSettings.find(c => c.id === editingId);
            if (editingId && !editingCard) {
                alert('수정하려던 카드가 사라졌어요. 목록을 새로 불러옵니다.');
                resetForm();
                reloadCards();
                return;
            }
            let next;
            if (editingCard && editingCard.customPairs) {
                // 거울카드: 이름만 수정
                if (!name) return alert("이름을 입력해 주세요!");
                next = cardSettings.map(c => c.id === editingId ? { ...c, name } : c);
            } else {
                const folder = document.getElementById('newCardFolder').value.trim();
                const orientation = document.getElementById('newCardOrientation').value;
                const total = parseInt(document.getElementById('newCardTotal').value);
                if (!name || !folder || !total) return alert("내용을 모두 채워주세요!");
                if (!(total > 0)) return alert("장수는 1 이상이어야 해요!");
                const payload = { name, folder, orientation, totalImages: total };
                if (editingId) {
                    next = cardSettings.map(c => c.id === editingId ? { ...c, ...payload } : c);
                } else {
                    next = [...cardSettings, { id: newId(), order: cardSettings.length, ...payload }];
                }
            }
            try { await saveCards(next); } catch (e) { return; }
            resetForm();
        };

        function startEdit(id) {
            const c = cardSettings.find(card => card.id === id);
            if (!c) return;   // 동시 갱신으로 사라진 행을 눌렀을 때
            editingId = id;
            document.getElementById('newCardName').value = c.name;
            const isMirror = !!c.customPairs;
            document.getElementById('newCardFolder').value = isMirror ? '(거울카드 — 폴더 변경 불가)' : (c.folder || '');
            document.getElementById('newCardOrientation').value = c.orientation || 'vertical';
            document.getElementById('newCardTotal').value = isMirror ? c.totalImages + ' (수정 불가)' : c.totalImages;
            document.getElementById('newCardFolder').disabled = isMirror;
            document.getElementById('newCardOrientation').disabled = isMirror;
            document.getElementById('newCardTotal').disabled = isMirror;
            document.getElementById('addCardBtn').textContent = "수정하기";
            document.getElementById('cancelEditBtn').classList.remove('hidden');
        }

        function resetForm() {
            editingId = null;
            ['newCardName', 'newCardFolder', 'newCardTotal'].forEach(id => {
                const el = document.getElementById(id);
                el.value = '';
                el.disabled = false;
            });
            document.getElementById('newCardOrientation').value = 'vertical';
            document.getElementById('newCardOrientation').disabled = false;
            document.getElementById('addCardBtn').textContent = "저장하기";
            document.getElementById('cancelEditBtn').classList.add('hidden');
        }

        document.getElementById('exportBtn').onclick = () => {
            const blob = new Blob([JSON.stringify(cardSettings, null, 2)], { type: 'application/json' });
            const a = document.createElement('a');
            const url = URL.createObjectURL(blob);
            a.href = url;
            a.download = '카드설정_' + new Date().toISOString().slice(0,10) + '.json';
            a.click();
            // 놓아주지 않으면 내보낼 때마다 blob 이 쌓여 탭을 닫을 때까지 남는다.
            // 다운로드가 시작된 뒤에 풀어야 해서 한 박자 미룬다.
            setTimeout(() => URL.revokeObjectURL(url), 1000);
        };

        document.getElementById('importBtn').onclick = () => document.getElementById('importFile').click();
        document.getElementById('importFile').onchange = async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            // 파일 해석과 서버 저장을 한 catch 로 묶으면, 저장이 403 으로 막혀도
            // "파일이 잘못됐다" 고 안내해 원인을 못 찾는다. 두 단계를 분리한다.
            let clean, dropped, dupFixed;
            try {
                const text = await file.text();
                const parsed = JSON.parse(text);
                if (!Array.isArray(parsed)) throw new Error();
                const seen = new Set();
                dupFixed = 0;
                clean = parsed
                    .filter(c => c && typeof c === 'object' && typeof c.name === 'string' && c.name.trim())
                    .map((c, i) => {
                        // id 가 겹치면 뒤 카드는 영영 열 수 없다(모든 조회가 find 로 앞의 것만 잡는다).
                        let id = c.id || newId();
                        if (seen.has(id)) { id = newId(); dupFixed++; }
                        seen.add(id);

                        const out = { ...c, id, order: typeof c.order === 'number' ? c.order : i };
                        out.folder = deckFolder(c);
                        // 문자열 'false' 가 그대로 저장되면 숨김/제외가 반대로 걸린다.
                        if ('hidden'   in c) out.hidden   = isFlagOn(c.hidden);
                        if ('noRepeat' in c) out.noRepeat = isFlagOn(c.noRepeat);

                        if (Array.isArray(c.customPairs)) {
                            // 짝이 문자열이 아니면 뽑기에서 startsWith 로 죽는다. 여기서 걸러낸다.
                            out.customPairs = c.customPairs.filter(validPair);
                            out.totalImages = out.customPairs.length;
                        } else {
                            out.totalImages = parseInt(c.totalImages) || 0;
                        }
                        return out;
                    })
                    // 쓸 수 있는 카드만 남긴다: 그림이 있고, 그림을 찾아갈 경로가 있어야 한다.
                    .filter(c => {
                        if (c.totalImages <= 0) return false;
                        if (c.customPairs) {
                            return c.customPairs.every(p => p.front.startsWith('data:')) || !!c.folder;
                        }
                        return !!c.folder;
                    });
                if (!clean.length) throw new Error();
                dropped = parsed.length - clean.length;
            } catch {
                alert('올바른 카드 설정 파일이 아닙니다.');
                e.target.value = '';
                return;
            }

            const notes = [];
            if (dropped)  notes.push(`형식이 잘못된 ${dropped}개는 제외`);
            if (dupFixed) notes.push(`번호가 겹친 ${dupFixed}개는 새 번호로`);
            const warn = notes.length ? ` (${notes.join(', ')})` : '';
            if (!confirm(`${clean.length}개의 카드 설정을 불러옵니다. 기존 설정을 덮어씁니다.${warn}`)) {
                e.target.value = '';
                return;
            }

            try {
                await saveCards(clean);
                alert('불러오기 완료!');
            } catch (err) {
                // saveCards 가 이미 원인에 맞는 안내를 띄웠다. 파일 탓으로 돌리지 않는다.
            }
            e.target.value = '';
        };

        async function deleteCard(id) {
            if(!confirm("삭제할까요?")) return;
            const next = cardSettings.filter(c => c.id !== id);
            if (next.length === cardSettings.length) return;
            try { await saveCards(next); } catch (e) {}
        }

        // 🪞 거울카드: preload 스킵
        const _origPreload = preloadImages;
        preloadImages = async (card) => {
            if (card.customPairs) {
                _preloadToken++;   // 직전 덱의 다운로드 큐를 반드시 멈춘다
                clearPreload();    // 직전 덱 이미지도 놓아준다
                return;
            }
            return _origPreload(card);
        };

        document.getElementById('mirrorBatchBtn').onclick = () => openMirrorModal(null);

        // ===== 거울카드 일괄 등록 =====
        let _mirrorImages = [];
        let _editingMirrorId = null;

        function openMirrorModal(editId = null) {
            // 문자열 id 만 '수정'으로 인정한다(이벤트 객체 등이 새면 신규 등록이 증발한다).
            _editingMirrorId = (typeof editId === 'string' && editId) ? editId : null;
            editId = _editingMirrorId;
            _mirrorImages = [];
            const existing = editId && cardSettings.find(c => c.id === editId);
            document.getElementById('mirrorCardName').value   = existing ? existing.name   : '';
            document.getElementById('mirrorCardFolder').value = existing ? existing.folder : '';
            document.getElementById('mirrorCardOrientation').value = existing ? (existing.orientation || 'vertical') : 'vertical';
            document.getElementById('mirrorImgGrid').innerHTML = existing
                ? `<p style="color:#bcaaa4; font-size:.9rem;">현재 ${existing.totalImages}쌍 등록됨. 아래에서 파일을 다시 선택해 짝을 수정하세요.</p>`
                : '';
            document.getElementById('mirrorPairSection').style.display = 'none';
            document.getElementById('mirrorStatus').textContent = '';
            document.getElementById('mirrorFileInput').value = '';
            document.getElementById('mirrorModal').style.display = 'block';
        }
        function closeMirrorModal() {
            document.getElementById('mirrorModal').style.display = 'none';
            // blob URL 을 놓아주지 않으면 모달을 여닫을수록 메모리가 계속 쌓인다.
            _mirrorImages.forEach(m => { if (m.blobUrl) URL.revokeObjectURL(m.blobUrl); });
            _mirrorImages = [];
            document.getElementById('mirrorImgGrid').innerHTML = '';
            document.getElementById('mirrorPairSection').style.display = 'none';
        }
        document.getElementById('mirrorModal').addEventListener('click', e => {
            if (e.target === document.getElementById('mirrorModal')) closeMirrorModal();
        });

        function handleMirrorFiles(files) {
            // blob URL 방식 — base64 변환 없음
            _mirrorImages.forEach(m => { if (m.blobUrl) URL.revokeObjectURL(m.blobUrl); });
            _mirrorImages = [...files].map(file => ({
                file,
                name: file.name,
                blobUrl: URL.createObjectURL(file),
                role: 'none'
            }));
            _mirrorImages.sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true }));
            renderMirrorGrid();
        }

        function renderMirrorGrid() {
            const grid = document.getElementById('mirrorImgGrid');
            grid.innerHTML = _mirrorImages.map((m, i) => {
                const roleClass = m.role === 'front' ? 'is-front' : m.role === 'back' ? 'is-back' : 'is-none';
                const roleNum  = m.role === 'front'
                    ? '앞면 ' + (_mirrorImages.slice(0,i+1).filter(x=>x.role==='front').length)
                    : m.role === 'back'
                    ? '뒷면 ' + (_mirrorImages.slice(0,i+1).filter(x=>x.role==='back').length)
                    : '미지정';
                return `<div class="mirror-img-item ${roleClass}" onclick="cycleMirrorRole(${i})">
                    <img src="${m.blobUrl}" alt="${m.name}">
                    <div class="mirror-role-badge">${roleNum}<br><span style="font-size:.7rem;opacity:.7;">${m.name}</span></div>
                </div>`;
            }).join('');
            updateMirrorPairPreview();
        }

        function cycleMirrorRole(idx) {
            const order = ['none', 'front', 'back'];
            const cur = _mirrorImages[idx].role;
            _mirrorImages[idx].role = order[(order.indexOf(cur) + 1) % order.length];
            renderMirrorGrid();
        }

        function updateMirrorPairPreview() {
            const fronts = _mirrorImages.filter(m => m.role === 'front');
            const backs  = _mirrorImages.filter(m => m.role === 'back');
            const count  = Math.min(fronts.length, backs.length);
            const sec    = document.getElementById('mirrorPairSection');
            const preview= document.getElementById('mirrorPairPreview');
            const cntEl  = document.getElementById('mirrorPairCount');
            if (!count) { sec.style.display = 'none'; return; }
            sec.style.display = 'block';
            cntEl.textContent = `(${count}쌍)`;
            preview.innerHTML = Array.from({length: count}, (_, i) => `
                <div class="mirror-pair-card">
                    <img src="${fronts[i].blobUrl}" title="앞면 ${i+1}">
                    <span class="mirror-pair-arrow">↔</span>
                    <img src="${backs[i].blobUrl}" title="뒷면 ${i+1}">
                    <span style="font-size:.7rem; color:#bcaaa4; margin-left:4px;">${fronts[i].name}<br>↕<br>${backs[i].name}</span>
                </div>`).join('');
        }


        async function saveMirrorCard() {
            const name   = document.getElementById('mirrorCardName').value.trim();
            const folder = document.getElementById('mirrorCardFolder').value.trim();
            if (!name)   { alert('카드 이름을 입력해 주세요.'); return; }
            if (!folder) { alert('GitHub 폴더명을 입력해 주세요.'); return; }
            const fronts = _mirrorImages.filter(m => m.role === 'front');
            const backs  = _mirrorImages.filter(m => m.role === 'back');
            const count  = Math.min(fronts.length, backs.length);
            if (!count) { alert('앞면과 뒷면이 각각 1장 이상 필요해요.'); return; }
            const orientation = document.getElementById('mirrorCardOrientation').value;
            const status = document.getElementById('mirrorStatus');
            // 파일명만 저장 — base64 변환 없음
            const customPairs = Array.from({length: count}, (_, i) => ({
                front: fronts[i].name,
                back:  backs[i].name
            }));
            status.textContent = '서버에 저장 중...';
            let updated;
            if (_editingMirrorId && !cardSettings.some(c => c.id === _editingMirrorId)) {
                status.textContent = '❌ 수정하려던 카드를 찾을 수 없습니다. 창을 닫고 다시 시도해 주세요.';
                return;
            }
            if (_editingMirrorId) {
                updated = cardSettings.map(c => c.id === _editingMirrorId
                    ? { ...c, name, folder, orientation, totalImages: count, customPairs }
                    : c);
            } else {
                const newCard = { id: newId(), order: cardSettings.length, name, folder, orientation, totalImages: count, customPairs };
                updated = [...cardSettings, newCard];
            }
            try {
                await saveCards(updated);
                status.textContent = `✅ "${name}" ${_editingMirrorId ? '수정' : '등록'} 완료! (${count}쌍)`;
                setTimeout(closeMirrorModal, 1200);
            } catch (e) {
                status.textContent = '❌ 저장 실패: ' + e.message;
            }
        }

        // --- '전체' 버튼 ---
        document.getElementById('drawAllBtn').onclick = () => {
            if(!currentCard) return;
            drawCountInput.value = deckSize(currentCard);
            
            // 🔥 전체 버튼을 눌렀다는 플래그를 저장합니다 (애니메이션 딜레이 조절용)
            isDrawAllClicked = true;
            document.getElementById('drawBtn').click();
        };

        // --- 5. 🃏 렉 없는 동시 애니메이션 (시간차 부여 & Async 적용) ---
        // 거울카드는 totalImages 와 실제 짝 수가 어긋날 수 있다(짝 수정 중 파일을 덜 지정한 경우).
        // 그때 예전에는 요청한 장수보다 조용히 적게 나왔다 — 실제 개수를 진실로 삼는다.
        // 불러온 파일이나 옛 데이터에는 폴더가 없거나 짝이 문자열이 아닐 수 있다.
        // 그대로 두면 './undefined/...' 로 요청이 나가거나(전부 404) startsWith 에서 죽는다.
        function deckFolder(card) {
            const f = card && card.folder;
            return (typeof f === 'string' && f.trim()) ? f.trim() : '';
        }
        function validPair(p) {
            return p && typeof p.front === 'string' && typeof p.back === 'string';
        }

        // 서버 데이터가 불리언이 아니라 문자열('false')로 들어올 수 있다.
        // cardHasBack 과 같은 규칙으로 읽는다.
        // 켜짐/꺼짐 플래그. 서버 데이터는 불리언이 아니라 문자열일 수 있고
        // "false" 는 참인 문자열이라 그냥 쓰면 반대로 동작한다(hasBack 이 실제로 문자열이다).
        function isFlagOn(v) {
            return v === true || v === 'true';
        }
        function deckNoRepeat(card) {
            return isFlagOn(card && card.noRepeat);
        }

        function needsFolder(card) {
            if (!card) return false;
            if (!Array.isArray(card.customPairs)) return true;
            const pairs = usablePairs(card);
            if (!pairs.length) return false;   // 그릴 게 없으면 deckSize 0 으로 따로 걸린다
            return !pairs.every(p => p.front.startsWith('data:') && p.back.startsWith('data:'));
        }

        // 그릴 수 있는 짝만 남긴다. 세는 기준과 그리는 기준이 다르면
        // 요청한 장수보다 조용히 적게 나온다.
        function usablePairs(card) {
            return (card && Array.isArray(card.customPairs))
                ? card.customPairs.filter(validPair)
                : [];
        }

        // 앞면을 못 받은 카드는 깨진 아이콘 대신 '?' 자리표시로 바꾼다.
        // 뒤집기도 끄고, 몇 번 그림이 없는지 콘솔에 남겨 교사가 찾을 수 있게 한다.
        function markMissingFront(container, url) {
            container.dataset.missing = '1';   // 뒤늦게 오는 뒷면 onload 를 막는 표시
            container.classList.remove('can-flip');
            container.classList.add('placeholder-card');
            container.onclick = null;
            container.innerHTML = '<div class="flipper"><div class="card-front"><span class="q-mark">?</span></div></div>';
            console.warn('그림을 찾을 수 없습니다:', url);
        }

        function deckSize(card) {
            if (!card) return 0;
            if (card.customPairs) return Math.min(card.totalImages || 0, usablePairs(card).length);
            return card.totalImages || 0;
        }

        document.getElementById('drawBtn').onclick = async () => {
            if (!currentCard) return;
            const myDraw = ++_drawToken;
            let count = parseInt(drawCountInput.value);
            if (isNaN(count) || count < 1) count = 1;
            const declared = currentCard.totalImages || 0;
            const total = deckSize(currentCard);
            if (total === 0) { alert('이 카드에는 그림이 없습니다. 선생님께 알려 주세요.'); return; }
            const folder = deckFolder(currentCard);   // 이 뽑기 전체가 이 값 하나만 쓴다
            if (needsFolder(currentCard) && !folder) {
                alert('이 카드에 폴더가 지정되지 않았습니다. 선생님께 알려 주세요.');
                return;
            }
            if (count > total) {
                count = total;
                drawCountInput.value = String(total);   // 입력칸도 정리해 같은 안내가 반복되지 않게
                // 실제 장수가 덱이 말한 것보다 적다면 데이터 문제다. 그때만 알린다.
                if (total < declared) alert(`이 카드는 ${total}장까지만 있어요.`);
            }
            const isHorizontal = currentCard.orientation === 'horizontal';
            const wasDrawAll = isDrawAllClicked;
            // 많이 뽑을 때는 화면 밖 카드의 다운로드·디코딩을 스크롤 시점까지 미룬다.
            // (한 장은 커도 상관없지만 40~100장이 동시에 디코딩되면 태블릿이 죽는다)
            // 많이 뽑으면 지연 로딩, 적게 뽑으면 우선 로딩. 둘은 서로 배타적이다.
            const lazyAttr = count > LAZY_THRESHOLD ? ' loading="lazy"' : '';
            const frontAttr = lazyAttr || ' fetchpriority="high"';

            if(isDrawAllClicked || count > 10) resultArea.classList.add('draw-all-mode');
            else resultArea.classList.remove('draw-all-mode');
            isDrawAllClicked = false;

            initAudio();
            playSimultaneousDrawSound();

            // '뽑은 것 제외' 덱이면 이미 나온 번호를 후보에서 뺀다.
            const noRepeat = deckNoRepeat(currentCard);
            let drawnSet = null;
            if (noRepeat) {
                drawnSet = drawnSetFor(currentCard);
                // 남은 게 요청한 장수보다 적으면 한 바퀴 돈 것으로 보고 다시 섞는다.
                // (남은 몇 장만 주면 '요청한 만큼 안 나온다'가 되어 더 헷갈린다)
                if (total - drawnSet.size < count) {
                    // 덱을 통째로 뽑는 경우('전체')는 애초에 한 바퀴를 새로 도는 것이라
                    // "모두 사용했다"는 안내가 사실과 다르다. 조용히 새로 섞는다.
                    const wholeDeck = count >= total;
                    drawnSet.clear();
                    if (!wholeDeck) alert('카드를 모두 사용해서 다시 섞었어요.');
                }
            }

            let nums = [];
            for (let i = 1; i <= total; i++) {
                if (!noRepeat || !drawnSet.has(i)) nums.push(i);
            }
            for (let i = nums.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [nums[i], nums[j]] = [nums[j], nums[i]];
            }
            if(count > nums.length) count = nums.length;
            nums = nums.slice(0, count);
            if (noRepeat) nums.forEach(n => drawnSet.add(n));

            resultArea.innerHTML = '';
            const fragment = document.createDocumentFragment();
            const delayTime = wasDrawAll ? 0.04 : 0.02;

            if (currentCard.customPairs) {
                // 🪞 거울카드: 파일명 → GitHub URL
                const folderEnc = encodeURIComponent(folder);
                const pairs = usablePairs(currentCard);   // 세는 기준과 같은 목록에서 뽑는다
                nums.forEach((n, index) => {
                    const pair = pairs[n - 1];
                    if (!pair) return;
                    if (!pair.front.startsWith('data:') && !folderEnc) return;
                    // pair.front/back 이 base64(data:)이면 그대로, 파일명이면 폴더 URL 조합
                    const frontSrc = pair.front.startsWith('data:') ? pair.front : `./${folderEnc}/${encodeURIComponent(pair.front)}`;
                    const backSrc  = pair.back.startsWith('data:')  ? pair.back  : `./${folderEnc}/${encodeURIComponent(pair.back)}`;
                    const container = document.createElement('div');
                    container.className = 'flip-container can-flip' + (isHorizontal ? ' horizontal' : '');
                    container.style.animationDelay = `${index * delayTime}s`;
                    container.innerHTML = `
                        <div class="flipper">
                            <img src="${frontSrc}" class="card-front" decoding="async"${frontAttr}>
                            <img src="${backSrc}"  class="card-back"  decoding="async"${lazyAttr}>
                        </div>`;
                    container.onclick = () => { playFlipSound(); container.classList.toggle('is-flipped'); };
                    const mf = container.querySelector('.card-front');
                    if (mf) mf.onerror = () => markMissingFront(container, frontSrc);
                    fragment.appendChild(container);
                });
            } else {
                // 📁 기존 폴더 기반 카드
                const pattern = await detectPattern(currentCard);
                // 뒷면이 없다고 표시된 덱은 아예 확인하지 않는다.
                const declaredBack = currentCard.hasBack === true || currentCard.hasBack === 'true';
                const backPattern = cardHasBack(currentCard)
                    ? await detectBackPattern(folder, pattern, declaredBack)
                    : 'none';
                nums.forEach((n, index) => {
                    const container = document.createElement('div');
                    container.className = 'flip-container' + (isHorizontal ? ' horizontal' : '');
                    container.style.animationDelay = `${index * delayTime}s`;

                    const frontUrl = buildFrontUrl(folder, n, pattern);

                    if (backPattern === 'none') {
                        // 뒷면 없는 덱: 요청을 아예 만들지 않는다(예전엔 카드마다 404 가 나갔다).
                        container.innerHTML = `
                            <div class="flipper">
                                <img src="${frontUrl}" class="card-front" decoding="async"${frontAttr}>
                            </div>`;
                        const only = container.querySelector('.card-front');
                        if (only) only.onerror = () => markMissingFront(container, frontUrl);
                        fragment.appendChild(container);
                        return;
                    }

                    // 폴더당 1회 감지한 결과를 그대로 쓴다 — 카드마다 틀린 이름으로 먼저 찔러보지 않는다.
                    const backUrl = buildBackUrl(currentCard.folder, n, backPattern);
                    container.innerHTML = `
                        <div class="flipper">
                            <img src="${frontUrl}" class="card-front" decoding="async"${frontAttr}>
                            <img src="${backUrl}" class="card-back" decoding="async"${lazyAttr}>
                        </div>`;

                    const missFront = container.querySelector('.card-front');
                    if (missFront) missFront.onerror = () => markMissingFront(container, frontUrl);

                    const backEl = container.querySelector('.card-back');
                    backEl.onload = () => {
                        // 앞면이 이미 실패해 자리표시로 바뀐 카드는 되살리지 않는다.
                        if (container.dataset.missing === '1') return;
                        container.classList.add('can-flip');
                        container.onclick = () => { playFlipSound(); container.classList.toggle('is-flipped'); };
                    };
                    backEl.onerror = () => {
                        // 그 장만 뒷면이 빠진 경우. 폴더 판정을 뒤집지는 않는다.
                        backEl.style.display = 'none';
                    };
                    fragment.appendChild(container);
                });
            }

            // 그 사이 다시 뽑았다면 이 결과는 버린다(연타 시 두 벌이 쌓이던 문제).
            if (myDraw !== _drawToken) return;
            resultArea.innerHTML = '';
            resultArea.appendChild(fragment);
            updateRemainInfo();
        };
    </script>
</body>
</html>
